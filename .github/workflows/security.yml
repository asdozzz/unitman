name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed if config is missing
        run: test -f .gitleaks.toml

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          set -eu
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets (redacted)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

  fallback-scan:
    name: fallback secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed if scanner is missing
        run: test -x scripts/check-secrets.sh

      - name: Run dependency-free scanner
        run: scripts/check-secrets.sh

  contracts:
    name: no-credentials contracts (LT-4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unitman
        uses: actions/checkout@v4
        with:
          path: unitman

      - name: Checkout unitman-front (AI manifest)
        uses: actions/checkout@v4
        with:
          repository: asdozzz/unitman-front
          path: unitman-front
          # Для приватного front-репозитория нужен PAT/read-token.
          token: ${{ secrets.UNITMAN_FRONT_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Contract check (OpenAPI + AI manifest)
        working-directory: unitman
        run: >
          php scripts/check-no-credentials-in-contracts.php
          --openapi=docs/openapi.json
          --ai-manifest=../unitman-front/src/modules/ai-chat/generated/openapi.tools.json

      - name: Self-test (synthetic violation must be detected)
        working-directory: unitman
        run: >
          php scripts/check-no-credentials-in-contracts.php --self-test
          --openapi=docs/openapi.json
          --ai-manifest=../unitman-front/src/modules/ai-chat/generated/openapi.tools.json

  # LT-3 authorization matrix (ReadEndpointsAuthorizationMatrixTest) и runtime
  # LT-4 scan требуют PostgreSQL и .env.test (см. phpunit.xml.dist). В этом
  # workflow инфраструктура приложения не поднимается, поэтому матрица
  # запускается в среде с docker-compose:
  #   make up && docker exec <web> vendor/bin/phpunit --filter ReadEndpointsAuthorizationMatrixTest
  # Non-DB контрактный сторож (contracts) выполняется всегда.
