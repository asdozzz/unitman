services:
  web:
    build:
      context: ./
      args:
        - CURRENT_USER_ID=${UID}
        - CURRENT_USER_GROUP=${GID}
    restart: always
    ports:
      - '${UNITMAN_API_PORT}:8080'
      - 2112:2112
      - 30000:30000
    user: root
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
      - "TEMPORAL_WORKER_QUEUE=unitman-mono-queue"
    volumes:
      - ./.docker/php/settings.ini:/usr/local/etc/php/php.ini

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./.docker/postgres/custom.conf:/etc/postgresql.conf
      - ./var/volume/pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql.conf"

  beanstalk:
    container_name: beanstalk
    image: touchify/beanstalkd
    restart: always
    volumes:
      - ./var/volume/beanstalk:/var/cache/beanstalkd

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    volumes:
      - ./.docker/centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - ${UNITMAN_CENTRIFUGO_PORT:-8000}:8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./var/volume/redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # $$ экранирует переменные: их должен подставлять shell ВНУТРИ контейнера,
    # а не compose на хосте.
    # Пользователь default отключён: при указании --aclfile директива
    # requirepass игнорируется, поэтому "user default on nopass" ранее делал
    # Redis полностью открытым на порту 6380.
    # Форма списка (а не folded scalar ">") важна: внутри ">" строки с большим
    # отступом сохраняют переводы строк, и echo попадает в ACL-файл с \n
    # внутри имени пользователя — Redis падает с "contains invalid characters".
    command:
      - sh
      - -c
      - |
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default off -@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
    healthcheck:
      # Проверяем именно те учётные данные, с которыми ходит RoadRunner KV:
      # redis-cli возвращает PONG даже после неудачного AUTH, поэтому
      # дополнительно фильтруем вывод через grep.
      test: [ "CMD-SHELL", "redis-cli --user \"$$REDIS_USER\" --pass \"$$REDIS_USER_PASSWORD\" --no-auth-warning ping | grep -qx PONG" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  # Официальные образы minio/minio и minio/mc удалены из Docker Hub,
  # quay.io/minio/* требует авторизации, поэтому используется публичное
  # legacy-зеркало Bitnami. Контракт авторизации сохранён:
  # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (см. .env.dist / .env.local).
  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    restart: always
    user: root
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_PUBLIC_ENDPOINT_CONSOLE:-http://localhost:9001}
      - MINIO_DATA_DIR=/data
      - MINIO_API_PORT_NUMBER=9000
      - MINIO_CONSOLE_PORT_NUMBER=9001
      - MINIO_SERVER_HOST=0.0.0.0
      - MINIO_CONSOLE_HOST=0.0.0.0
      # Автоматическое создание бакета при первом запуске (можно указать несколько через запятую)
      - MINIO_DEFAULT_BUCKETS=${MEDIATEKA_BUCKET}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./var/volume/minio:/data
    healthcheck:
      test: ["CMD", "/opt/bitnami/minio-client/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  buggregator:
    image: ghcr.io/buggregator/server:2.3
    environment:
      - VAR_DUMPER_PREVIEW_MAX_DEPTH=3
    ports:
      - 8086:8000
      - 9912:9912
      - 9913:9913
    restart: always
