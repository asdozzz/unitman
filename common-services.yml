services:
  web:
    build:
      context: ./
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '${UNITMAN_API_PORT}:8080'
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    user: "${UID}:${GID}"
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./var/volume/pgdata:/var/lib/postgresql/data

  unitman-proxy:
    image: nginx
    restart: always
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/html/index.html:/usr/share/nginx/html/index.html
    ports:
      - '8087:80'
