services:
  web:
    build:
      context: ./
      args:
        - CURRENT_USER_ID=${UID}
        - CURRENT_USER_GROUP=${GID}
    restart: always
    ports:
      - '${UNITMAN_API_PORT}:8080'
      - 2112:2112
      - 30000:30000
    user: root
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
      - "TEMPORAL_WORKER_QUEUE=unitman-mono-queue"
    volumes:
      - ./.docker/php/settings.ini:/usr/local/etc/php/php.ini

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./.docker/postgres/custom.conf:/etc/postgresql.conf
      - ./var/volume/pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql.conf"

  beanstalk:
    container_name: beanstalk
    image: touchify/beanstalkd
    restart: always
    volumes:
      - ./var/volume/beanstalk:/var/cache/beanstalkd

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    volumes:
      - ./.docker/centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - ${UNITMAN_CENTRIFUGO_PORT:-8000}:8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./var/volume/redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  # Официальные образы minio/minio и minio/mc удалены из Docker Hub,
  # quay.io/minio/* требует авторизации, поэтому используется публичное
  # legacy-зеркало Bitnami. Контракт авторизации сохранён:
  # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (см. .env.dist / .env.local).
  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    container_name: minio
    restart: always
    # root нужен только на старте: setup.sh выставляет владельца каталога данных,
    # дальше процесс запускается от непривилегированного пользователя minio
    user: root
    environment:
      # Авторизация MinIO задаётся только через env (см. .env.dist / .env.local)
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_PUBLIC_ENDPOINT_CONSOLE}
      # Образ Bitnami запускает minio через run.sh, поэтому каталог данных
      # и порты задаются переменными (по умолчанию /bitnami/minio/data)
      - MINIO_DATA_DIR=/data
      - MINIO_API_PORT_NUMBER=9000
      - MINIO_CONSOLE_PORT_NUMBER=9001
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./var/volume/minio:/data
    healthcheck:
      # liveness-эндпоинт самого MinIO: в образе Bitnami нет
      # предварительно настроенного alias `local` для `mc ready local`
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    # mc из того же legacy-зеркала Bitnami (официальный minio/mc недоступен)
    image: bitnamilegacy/minio-client:latest
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MEDIATEKA_BUCKET=${MEDIATEKA_BUCKET}
    # entrypoint образа переопределяется на sh, поэтому конфиг-каталог mc
    # (по умолчанию /.mc, недоступен для записи) задаётся явно
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        mc --config-dir /tmp/.mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc --config-dir /tmp/.mc mb --ignore-existing "local/$$MEDIATEKA_BUCKET" &&
        echo "bucket $$MEDIATEKA_BUCKET is ready"

  buggregator:
    image: ghcr.io/buggregator/server:2.3
    environment:
      - VAR_DUMPER_PREVIEW_MAX_DEPTH=3
    ports:
      - 8086:8000
      - 9912:9912
      - 9913:9913
    restart: always
