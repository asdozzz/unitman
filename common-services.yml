services:
  web:
    build:
      context: ./
      args:
        - CURRENT_USER_ID=${UID}
        - CURRENT_USER_GROUP=${GID}
    restart: always
    ports:
      - '${UNITMAN_API_PORT}:8080'
      - 2112:2112
      - 30000:30000
    user: root
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"

  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.14.0
    restart: always
    ports:
      - ${ES_PORT}:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    #volumes:
    # - ./var/volume/elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    container_name: kibana
    image: kibana:7.14.0
    depends_on:
      - elasticsearch
    restart: always
    environment:
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=d1a66dfd-c4d3-4a0a-8290-2abcb83ab3aa
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - ${KIBANA_PORT}:5601
    #volumes:
    # - ./var/volume/kibana_data:/usr/share/kibana/data

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./var/volume/pgdata:/var/lib/postgresql/data

  unitman-proxy:
    image: nginx
    restart: always
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/html/index.html:/usr/share/nginx/html/index.html
    ports:
      - '8087:80'

  beanstalk:
    image: touchify/beanstalkd
    hostname: beanstalk
    restart: always
    environment:
      BEANSTALKD_VERBOSE: 1
    volumes:
      - ./var/volume/beanstalk:/var/cache/beanstalkd

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    volumes:
      - ./.docker/centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - 8000:8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
