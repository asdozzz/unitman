services:
  # HTTP-роль: только HTTP-пул RoadRunner (см. .rr.http.yaml).
  # Порт 8080 и метрики 2112 остаются публичными как раньше.
  web:
    build: &unitman-web-build
      context: ./
      args:
        - CURRENT_USER_ID=${UID:-1000}
        - CURRENT_USER_GROUP=${GID:-1000}
    # Один образ на все три роли: команда роли задаётся через command.
    image: unitman-web
    restart: always
    user: root
    command: rr serve -c .rr.http.yaml
    ports:
      - '${UNITMAN_API_PORT}:8080'
      - 2112:2112
      - 30000:30000
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
      - "TEMPORAL_WORKER_QUEUE=unitman-mono-queue"
      # RPC-сокет HTTP-роли (совпадает с rpc.listen в .rr.http.yaml).
      - "RR_RPC=tcp://127.0.0.1:6001"
      # Один общий мастер-ключ подписи callback-ов раннера (контракт v2).
      # Значение задаётся через `make runner-secret` в .env; пусто — fallback
      # на APP_SECRET (см. RunnerSecretGenerator).
      - "RUNNER_SECRET_MASTER_KEY=${RUNNER_SECRET_MASTER_KEY:-}"
    volumes:
      - ./.docker/php/settings.ini:/usr/local/etc/php/php.ini

  # Роль Jobs + динамические сервисы планировщика (см. .rr.worker.yaml).
  # 8080 наружу не публикуется: контейнер обслуживает только очередь и сервисы.
  web-worker:
    build: *unitman-web-build
    image: unitman-web
    restart: always
    user: root
    command: rr serve -c .rr.worker.yaml
    expose:
      - '2113'
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
      - "TEMPORAL_WORKER_QUEUE=unitman-mono-queue"
      # RPC-сокет роли jobs/сервисов (совпадает с rpc.listen в .rr.worker.yaml).
      - "RR_RPC=tcp://127.0.0.1:6002"
      - "RUNNER_SECRET_MASTER_KEY=${RUNNER_SECRET_MASTER_KEY:-}"
    volumes:
      - ./.docker/php/settings.ini:/usr/local/etc/php/php.ini

  # Роль Temporal activities (см. .rr.temporal.yaml).
  web-temporal:
    build: *unitman-web-build
    image: unitman-web
    restart: always
    user: root
    command: rr serve -c .rr.temporal.yaml
    expose:
      - '9091'
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
      - "TEMPORAL_WORKER_QUEUE=unitman-mono-queue"
      # RPC-сокет Temporal-роли (совпадает с rpc.listen в .rr.temporal.yaml).
      - "RR_RPC=tcp://127.0.0.1:6003"
      - "RUNNER_SECRET_MASTER_KEY=${RUNNER_SECRET_MASTER_KEY:-}"
    volumes:
      - ./.docker/php/settings.ini:/usr/local/etc/php/php.ini

  # ROLLBACK: одиночный RoadRunner со старым .rr.yaml (все роли в одном процессе).
  # Сервис подключается только через профиль rr-single, поэтому обычный
  # `docker compose up` его не запускает. Порты те же, что у web.
  # Откат одной командой:
  #   docker compose stop web web-worker web-temporal \
  #     && docker compose --profile rr-single up -d web-single
  web-single:
    build: *unitman-web-build
    image: unitman-web
    restart: always
    user: root
    command: rr serve -c .rr.yaml
    ports:
      - '${UNITMAN_API_PORT}:8080'
      - 2112:2112
      - 30000:30000
    # Temporal-метрики старого процесса остаются внутри сети.
    expose:
      - '9091'
    environment:
      - "TEMPORAL_CLI_ADDRESS=temporal:7233"
      - "TEMPORAL_WORKER_QUEUE=unitman-mono-queue"
      # .rr.yaml читает RR_RPC из окружения (fallback 6001).
      - "RR_RPC=tcp://127.0.0.1:6001"
      - "RUNNER_SECRET_MASTER_KEY=${RUNNER_SECRET_MASTER_KEY:-}"
    volumes:
      - ./.docker/php/settings.ini:/usr/local/etc/php/php.ini

  ###> edge (Go) services — профиль edge ###
  # Четыре сервиса edge используют один образ unitman-edge:dev (сборка ./go/edge).
  # Пока профиль edge не включён, `docker compose up` их не собирает и не
  # запускает: дефолтный стек, порт 8082 и PHP-путь остаются без изменений.
  #
  # Прямые host-порты по умолчанию НЕ публикуются (только expose внутри сети).
  # Для прямого smoke раскомментируйте ports и задайте EDGE_*_PORT в .env.
  # Канареечный доступ — через edge-gateway (EDGE_GATEWAY_PORT, по умолчанию 8090).

  # Прогресс раннера: POST /api/runner/saveSteps, GET /api/runner/progress/{id}.
  edge-progress:
    profiles: ["edge"]
    build: &edge-build
      context: ./go/edge
      dockerfile: Dockerfile
    image: unitman-edge:dev
    restart: always
    command: ["progress"]
    # ports:
    #   - "${EDGE_PROGRESS_PORT:-18081}:8081"
    expose:
      - '8081'
    environment:
      - "REDIS_ADDR=redis:6379"
      - "REDIS_USER=${REDIS_USER}"
      # go-redis ходит под ACL-пользователем REDIS_USER, поэтому пароль берём
      # из REDIS_USER_PASSWORD (REDIS_PASSWORD — legacy-переменная, см. .env.dist).
      - "REDIS_PASSWORD=${REDIS_USER_PASSWORD}"
      - "CENTRIFUGO_API_ENDPOINT=http://centrifugo:8000/api"
      - "CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-}"
      - "PROGRESS_TTL_SECONDS=7200"
      # Per-runner HMAC-подпись saveSteps (контракт v2). Пустое значение —
      # fallback на APP_SECRET, как в PHP RunnerSecretGenerator; если и он пуст,
      # edge-progress отвечает 503 (fail closed).
      - "RUNNER_SECRET_MASTER_KEY=${RUNNER_SECRET_MASTER_KEY:-}"
      - "APP_SECRET=${APP_SECRET:-}"
    depends_on:
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks:
      - default

  # Потоковый шлюз медиа: PUT/GET/DELETE /media/{key...} в MinIO.
  edge-media:
    profiles: ["edge"]
    build: *edge-build
    image: unitman-edge:dev
    restart: always
    command: ["media"]
    # ports:
    #   - "${EDGE_MEDIA_PORT:-18082}:8082"
    expose:
      - '8082'
    environment:
      - "MINIO_ENDPOINT=http://minio:9000"
      - "MINIO_BUCKET=${MEDIATEKA_BUCKET}"
      - "MINIO_REGION=${MINIO_REGION:-us-east-1}"
      # Каноничные для edge-media имена; значения по умолчанию — root-учётка MinIO.
      # Если MINIO_ACCESS_KEY/MINIO_SECRET_KEY заданы явно, используются они.
      - "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}"
      - "MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}"
      - "MINIO_USE_PATH_STYLE=true"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - default

  # Webhook-ингресс GitLab/GitHub: валидирует, ограничивает размер и проксирует
  # события в существующий PHP-эндпоинт. Event store остаётся за PHP.
  edge-webhook:
    profiles: ["edge"]
    build: *edge-build
    image: unitman-edge:dev
    restart: always
    command: ["webhook"]
    expose:
      - '8084'
    environment:
      # APP_ENV gates the WEBHOOK_ALLOW_UNSIGNED escape hatch: it is only
      # honored for dev/local/test, never in production.
      - "APP_ENV=${APP_ENV:-dev}"
      - "PHP_WEBHOOK_BASE_URL=${PHP_WEBHOOK_BASE_URL:-http://web:8080}"
      - "WEBHOOK_MAX_BYTES=5242880"
      # Explicit development escape hatch; empty/absent signing secrets are
      # rejected with 403 unless this is literally "true" and APP_ENV is dev.
      - "WEBHOOK_ALLOW_UNSIGNED=${WEBHOOK_ALLOW_UNSIGNED:-false}"
      - "GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}"
      - "GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}"
      - "GITEA_WEBHOOK_SECRET=${GITEA_WEBHOOK_SECRET:-}"
      - "FORGEJO_WEBHOOK_SECRET=${FORGEJO_WEBHOOK_SECRET:-}"
      - "GITFLIC_WEBHOOK_SECRET=${GITFLIC_WEBHOOK_SECRET:-}"
      - "GITVERSE_WEBHOOK_SECRET=${GITVERSE_WEBHOOK_SECRET:-}"
      - "BITBUCKET_WEBHOOK_SECRET=${BITBUCKET_WEBHOOK_SECRET:-}"
      - "WEBHOOK_RATE_LIMIT_PER_SECOND=${WEBHOOK_RATE_LIMIT_PER_SECOND:-100}"
    depends_on:
      web:
        condition: service_started
    networks:
      - default

  # Экспортёр метрик Docker-контейнеров для Prometheus (только чтение сокета).
  # GID группы сокета на хосте: stat -c '%g' /var/run/docker.sock
  # и положите его в DOCKER_GID (.env). Резервное значение — 999.
  edge-telemetry:
    profiles: ["edge"]
    build: *edge-build
    image: unitman-edge:dev
    restart: always
    command: ["telemetry"]
    # ports:
    #   - "${EDGE_TELEMETRY_PORT:-18083}:8083"
    expose:
      - '8083'
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - default

  # Канареечный шлюз: прогресс, webhook и медиа уходят в Go-сервисы,
  # всё остальное — в PHP (web:8080). Публикуется отдельный порт 8090,
  # поэтому дефолтный API на UNITMAN_API_PORT (8082) не меняется.
  edge-gateway:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${EDGE_GATEWAY_PORT:-8090}:8080"
    volumes:
      - "./.docker/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - edge-progress
      - edge-media
      - edge-webhook
      - web
    networks:
      - default
  ###< edge (Go) services ###

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./.docker/postgres/custom.conf:/etc/postgresql.conf
      - ./var/volume/pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql.conf"

  beanstalk:
    container_name: beanstalk
    image: touchify/beanstalkd
    restart: always
    volumes:
      - ./var/volume/beanstalk:/var/cache/beanstalkd

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    volumes:
      - ./.docker/centrifugo/config.json:/centrifugo/config.json:ro
      - ./.docker/centrifugo/entrypoint.sh:/centrifugo-entrypoint.sh:ro
    # Renders the origin allowlist and fails closed when secrets/origins are
    # missing; secrets come from the environment, not the config file.
    entrypoint: ["/bin/sh", "/centrifugo-entrypoint.sh"]
    command: ["-c", "/tmp/centrifugo.json"]
    environment:
      - "UNITMAN_CENTRIFUGO_SECRET=${CENTRIFUGO_SECRET:-}"
      - "UNITMAN_CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-}"
      - "UNITMAN_CENTRIFUGO_ALLOWED_ORIGINS=${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000}"
    ports:
      # Loopback by default; set CENTRIFUGO_BIND_HOST=0.0.0.0 explicitly.
      - "${CENTRIFUGO_BIND_HOST:-127.0.0.1}:${UNITMAN_CENTRIFUGO_PORT:-8000}:8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./var/volume/redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # $$ экранирует переменные: их должен подставлять shell ВНУТРИ контейнера,
    # а не compose на хосте.
    # Пользователь default отключён: при указании --aclfile директива
    # requirepass игнорируется, поэтому "user default on nopass" ранее делал
    # Redis полностью открытым на порту 6380.
    # Форма списка (а не folded scalar ">") важна: внутри ">" строки с большим
    # отступом сохраняют переводы строк, и echo попадает в ACL-файл с \n
    # внутри имени пользователя — Redis падает с "contains invalid characters".
    command:
      - sh
      - -c
      - |
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default off -@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
    healthcheck:
      # Проверяем именно те учётные данные, с которыми ходит RoadRunner KV:
      # redis-cli возвращает PONG даже после неудачного AUTH, поэтому
      # дополнительно фильтруем вывод через grep.
      test: [ "CMD-SHELL", "redis-cli --user \"$$REDIS_USER\" --pass \"$$REDIS_USER_PASSWORD\" --no-auth-warning ping | grep -qx PONG" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  # Официальные образы minio/minio и minio/mc удалены из Docker Hub,
  # quay.io/minio/* требует авторизации, поэтому используется публичное
  # legacy-зеркало Bitnami. Контракт авторизации сохранён:
  # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (см. .env.dist / .env.local).
  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    restart: always
    user: root
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_PUBLIC_ENDPOINT_CONSOLE:-http://localhost:9001}
      - MINIO_DATA_DIR=/data
      - MINIO_API_PORT_NUMBER=9000
      - MINIO_CONSOLE_PORT_NUMBER=9001
      - MINIO_SERVER_HOST=0.0.0.0
      - MINIO_CONSOLE_HOST=0.0.0.0
      # Автоматическое создание бакета при первом запуске (можно указать несколько через запятую)
      - MINIO_DEFAULT_BUCKETS=${MEDIATEKA_BUCKET}
    ports:
      # Loopback by default; opt in to external exposure explicitly.
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./var/volume/minio:/data
    healthcheck:
      test: ["CMD", "/opt/bitnami/minio-client/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot-инициализация Mediateka: ждём healthy minio и создаём бакет.
  # Отдельный сервис нужен, чтобы web стартовал только после появления бакета
  # (dc.mvp.yml: minio-init: condition: service_completed_successfully).
  # Образ тот же, что у minio: официальные minio/minio и minio/mc удалены из
  # Docker Hub, а в Bitnami-образе mc лежит по /opt/bitnami/minio-client/bin/mc
  # — на этот же путь опирается healthcheck сервиса minio.
  # $$ экранирует переменные: их раскрывает shell ВНУТРИ контейнера, а не compose
  # на хосте (иначе подставились бы значения из .env хоста, а не окружения сервиса).
  minio-init:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # HOME у образа равен '/', процесс работает от uid 1001 — писать в корень
      # нельзя, поэтому конфиг mc кладём в /tmp.
      - MC_CONFIG_DIR=/tmp/.mc
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MEDIATEKA_BUCKET=${MEDIATEKA_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        MC=/opt/bitnami/minio-client/bin/mc
        "$$MC" alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        "$$MC" mb --ignore-existing "local/$$MEDIATEKA_BUCKET"

  buggregator:
    image: ghcr.io/buggregator/server:2.3
    environment:
      - VAR_DUMPER_PREVIEW_MAX_DEPTH=3
    ports:
      - 8086:8000
      - 9912:9912
      - 9913:9913
    restart: always

  # Локальный Docker Registry v2 с pull-through-прокси Docker Hub.
  # Реестр принадлежит инфраструктуре backend: раннер получает его адрес при
  # регистрации (UNITMAN_REGISTRY_PUBLIC_ADDRESS), поэтому хардкод
  # unitman-registry:5000 в коде раннера недопустим.
  # Хранилище — именованный том, чтобы данные не зависели от рабочей копии.
  unitman-registry:
    image: registry:2.8.3
    restart: always
    ports:
      - '5000:5000'
    volumes:
      - unitman-registry-data:/var/lib/registry
      - ./.docker/registry/simple.yml:/etc/docker/registry/config.yml:ro
    # busybox wget есть в образе registry:2.8.3 (Alpine).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

volumes:
  unitman-registry-data:
