monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            # Опечатка when@eee приводила к тому, что в dev-окружении не регистрировался
            # ни один обработчик и логи не писались вообще (var/log оставался пустым).
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # Отправка в buggregator необязательна: сервис не поднимается вместе с web
            # (см. docker-compose.yml), а Monolog\Handler\SocketHandler при недоступном
            # хосте бросает UnexpectedValueException прямо из Logger::addRecord(),
            # что превращается в 500. whatfailuregroup глушит сбой этого обработчика,
            # не затрагивая остальные.
            socket:
                type: whatfailuregroup
                members: [buggregator]
            buggregator:
                type: socket
                connection_string: '%env(MONOLOG_SOCKET_HOST)%'
                level: debug
                formatter: monolog.formatter.json
                channels: ["!event", "!doctrine", "!console", "!security"]
                connection_timeout: 1.0
                timeout: 1.0
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                channels: ["!event", "!doctrine", "!console", "!security"]
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: ERROR
                formatter: monolog.formatter.json
            console:
                type: console
                level: ERROR
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
