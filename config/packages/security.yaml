security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user:
            id: App\Account\Infra\Repository\JWTUserRepository

    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: api_login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt:
                provider: app_user

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        # Регистрация v2 публична: bootstrap-подписи больше нет.
        - { path: ^/api/runner/register$, roles: PUBLIC_ACCESS }
        # Управление публичным адресом раннера — только администратор.
        # Проверка роли дублируется в use case (defense in depth).
        - { path: '^/api/runner/[^/]+/public-address', roles: ROLE_ADMIN }
        # Callback-и раннера аутентифицируются per-runner подписью
        # (X-Runner-Id + X-Runner-Signature) в контроллере, а не JWT и не
        # глобальным секретом. Неизвестный runnerId — 404, неверная подпись — 401.
        - { path: '^/api/runner/[^/]+/projects/[^/]+/build-state$', roles: PUBLIC_ACCESS }
        - { path: ^/api/runner/saveSteps$, roles: PUBLIC_ACCESS }
        - { path: ^/api/runner/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/runner/unitStateNotifications$, roles: PUBLIC_ACCESS }
        - { path: ^/api/account/refreshToken$, roles: PUBLIC_ACCESS }
        - { path: ^/api/project/(.*)/hook$, roles: PUBLIC_ACCESS }
        # Логин по определению выполняется до аутентификации: требование
        # ROLE_USER/ROLE_ADMIN здесь делает вход невозможным (ролей ещё нет).
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # Административные маршруты (/api/runner/list и т.п.) остаются за
        # JWT; проверка роли администратора — в use case.
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
