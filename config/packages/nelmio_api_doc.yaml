                            example: /api/health
                UnitVariableValue:
                    type: object
                    required: [id, value]
                    properties:
                        id:
                            type: string
                        value:
                            type: string
                UnitSvyaz:
                    type: object
                    description: Связь переменной юнита с юнитом, выбранным через хелпер (проекция svyazi_unitov)
                    required: [variableId, targetUnitId, projectId]
                    properties:
                        variableId:
                            type: string
