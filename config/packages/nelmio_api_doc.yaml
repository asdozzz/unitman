                        id:
                            type: string
                        email:
                            type: string
                            format: email
                        isBlocked:
                            type: boolean
                        roles:
                            type: string
                        password:
                            type: string
                        nickname:
                            type: string
                            nullable: true
                        pendingActivation:
                            type: boolean
                        emailVerified:
                            type: boolean
                AccountSettings:
                    type: object
                    description: Настройки пользователя (AccountSettingsReadModel)
                    required: [nickname]
                    properties:
                        nickname:
                            type: string
                            nullable: true
                # --- Mediateka: файлы юнитов ---
                MediatekaFaylUnita:
                    type: object
                    description: Метаданные файла юнита (FaylUnita::toArray)
                    required: [id, name, size, mimeType, uploadedBy, createdAt]
