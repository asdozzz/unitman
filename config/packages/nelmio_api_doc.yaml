nelmio_api_doc:
    documentation:
        openapi: 3.1.0
        info:
            title: Unitman API
            description: API сервиса автоматического создания тестовых стендов
            version: 1.0.0
        security:
            - bearerAuth: []
        tags:
            - name: Account
              description: Аккаунты, роли, настройки
            - name: Runner
              description: Исполнитель сборки и запуска контейнеров
            - name: Project
              description: Проекты (Git-репозитории в Unitman)
            - name: Repo
              description: Учётные данные доступа к репозиториям
            - name: Webhook
              description: Webhook'и проектов
            - name: Unit
              description: Тестовые стенды
            - name: Mediateka
              description: Файлы юнитов (zip-архивы в MinIO)
            - name: OpenCode
              description: Сессии и ходы OpenCode (вопросы, ответы, прогресс)
            - name: AI
              description: AI-чат с инструментами, сгенерированными из OpenAPI
        # Маршруты, которые создаются не контроллерами проекта, а бандлами
        # (lexik JSON-логин), поэтому описываются декларативно.
        paths:
            /api/login:
                post:
                    tags: [Account]
                    summary: Получить JWT-токен
                    description: JSON-логин (lexik/jwt-authentication-bundle). Токен затем передаётся в заголовке Authorization.
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [username, password]
                                    properties:
                                        username:
                                            type: string
                                            format: email
                                            example: user@example.com
                                        password:
                                            type: string
                                            format: password
                                            example: secret
                    responses:
                        '200':
                            description: Токен выдан
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        required: [token, refreshToken]
                                        properties:
                                            token:
                                                type: string
                                                example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
                                            refreshToken:
                                                type: string
                                                description: Одноразовый токен для /api/account/refreshToken
                                                example: a1b2c3d4e5f6...
                                            user:
                                                $ref: '#/components/schemas/AccountLoginUser'
                        '401':
                            description: Неверные учётные данные
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                SuccessEnvelope:
                    type: object
                    description: Успешный ответ (App\Utils\Model\Reponse\SuccessResponse)
                    required: [status, data]
                    properties:
                        status:
                            type: string
                            enum: [success]
                            example: success
                        data:
                            type: object
                            nullable: true
                FailEnvelope:
                    type: object
                    description: Ожидаемая ошибка (App\Utils\Model\Reponse\FailResponse)
                    required: [status, data]
                    properties:
                        status:
                            type: string
                            enum: [fail]
                            example: fail
                        data:
                            type: object
                            nullable: true
                ErrorEnvelope:
                    type: object
                    description: Ошибка (App\Utils\Model\Reponse\ErrorResponse), возвращается с HTTP 200
                    required: [status, message, code]
                    properties:
                        status:
                            type: string
                            enum: [error]
                            example: error
                        message:
                            type: string
                            example: Недостаточно прав
                        code:
                            type: string
                            enum: [DEFAULT, LOCK]
                            example: DEFAULT
                # Тела запросов, привязываемые через JsonBodySerializableInterface.
                # Nelmio читает атрибуты только с контроллера, поэтому DTO-схемы описаны здесь.
                RegisterAccount:
                    type: object
                    description: 'Пароль не передаётся: система генерирует его и отправляет на email'
                    required: [email, roles, locale]
                    properties:
                        email:
                            type: string
                            format: email
                            example: user@example.com
                        roles:
                            type: string
                            description: В коде объявлено строкой, а не массивом
                            example: ROLE_USER
                        locale:
                            type: string
                            example: ru
                        nickname:
                            type: string
                            nullable: true
                            example: nickname
                RegisterPendingAccount:
                    type: object
                    description: Публичная заявка на регистрацию; роль всегда ROLE_PENDING
                    required: [email, password]
                    properties:
                        email:
                            type: string
                            format: email
                            example: user@example.com
                        password:
                            type: string
                            format: password
                            example: secret
                        locale:
                            type: string
                            example: ru
                        nickname:
                            type: string
                            nullable: true
                            example: nickname
                VerifyEmail:
                    type: object
                    required: [email, code]
                    properties:
                        email:
                            type: string
                            format: email
                            example: user@example.com
                        code:
                            type: string
                            minLength: 6
                            maxLength: 6
                            example: '123456'
                ResendEmailVerification:
                    type: object
                    required: [email]
                    properties:
                        email:
                            type: string
                            format: email
                            example: user@example.com
                OAuthExchange:
                    type: object
                    required: [code]
                    properties:
                        code:
                            type: string
                            description: Одноразовый код из callback-редиректа
                OAuthProviderList:
                    type: object
                    required: [providers]
                    properties:
                        providers:
                            type: array
                            items:
                                type: string
                                enum: [google, github]
                ActivateAccountByAdmin:
                    type: object
                    required: [accountId]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                ChangeEmailByAdmin:
                    type: object
                    required: [accountId, newEmail]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newEmail:
                            type: string
                            format: email
                            example: user@example.com
                ChangeNicknameByAdmin:
                    type: object
                    required: [accountId, newNickname]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newNickname:
                            type: string
                            example: nickname
                ChangePasswordByAdmin:
                    type: object
                    required: [accountId, newPassword]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newPassword:
                            type: string
                            format: password
                ChangeRoleByAdmin:
                    type: object
                    required: [accountId, newRole]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newRole:
                            type: string
                            example: ROLE_USER
                ChangeMyLocale:
                    type: object
                    required: [locale]
                    properties:
                        locale:
                            type: string
                            example: ru
                SozdatRekvizityOpenCode:
                    type: object
                    description: 'Реквизиты подключения к OpenCode (API-ключ шифруется на бэкенде). Для известного провайдера `url` можно не передавать — подставляется `baseUrl` каталога; для `custom` он обязателен'
                    required: [name, apiKey]
                    properties:
                        name:
                            type: string
                            maxLength: 128
                            description: 'Произвольное имя реквизитов, уникальное в рамках аккаунта'
                            example: 'Рабочий ключ'
                        provider:
                            type: string
                            maxLength: 64
                            default: custom
                            description: 'Код провайдера из `GET /api/account/opencode/providers`; `custom` — произвольный OpenAI-совместимый эндпоинт'
                            example: openai
                        url:
                            type: string
                            maxLength: 512
                            nullable: true
                            description: 'Базовый URL API. Для известного провайдера игнорируется и подставляется из каталога, для `custom` обязателен (`account.opencode_credential.empty_url`)'
                            example: 'https://api.openai.com/v1'
                        models:
                            type: array
                            maxItems: 50
                            uniqueItems: true
                            description: 'Набор моделей реквизитов (1–50, без дубликатов). Пустой массив при заполненном legacy `model` трактуется как `[model]`'
                            items:
                                type: string
                                maxLength: 128
                            example: ['gpt-4o', 'gpt-4o-mini']
                        defaultModel:
                            type: string
                            maxLength: 128
                            nullable: true
                            description: 'Дефолтная модель набора; пустое значение — первая модель из `models`'
                            example: gpt-4o
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                            description: 'Устаревший синоним единственной модели. При заполненном `model` и пустых `models` набором становится `[model]`'
                            example: 'claude-sonnet-4'
                        apiKey:
                            type: string
                            format: password
                            description: 'API-ключ в открытом виде; на сервере шифруется AES-256-GCM и наружу больше не отдаётся'
                IzmenitRekvizityOpenCode:
                    type: object
                    description: 'Частичное изменение реквизитов OpenCode: непереданные поля не меняются'
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                        name:
                            type: string
                            maxLength: 128
                            nullable: true
                        provider:
                            type: string
                            maxLength: 64
                            nullable: true
                            description: 'Новый провайдер; null — оставить прежний'
                        url:
                            type: string
                            maxLength: 512
                            nullable: true
                        models:
                            type: array
                            maxItems: 50
                            uniqueItems: true
                            nullable: true
                            description: 'Новый набор моделей (заменяет прежний целиком); null — оставить прежний'
                            items:
                                type: string
                                maxLength: 128
                        defaultModel:
                            type: string
                            maxLength: 128
                            nullable: true
                            description: 'Новая дефолтная модель; null — оставить прежнюю'
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                        apiKey:
                            type: string
                            format: password
                            nullable: true
                            description: 'Новый API-ключ. null или пустая строка — оставить прежний'
                UdalitRekvizityOpenCode:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                OpenCodeCredential:
                    type: object
                    description: 'Реквизиты OpenCode для показа пользователю (OpenCodeCredentialReadModel). Полный API-ключ отсутствует — только маска'
                    required: [id, name, provider, url, models, defaultModel, model, apiKeyHint, createdAt, updatedAt]
                    properties:
                        id:
                            type: string
                            format: uuid
                        name:
                            type: string
                            example: 'Рабочий ключ'
                        provider:
                            type: string
                            description: 'Код провайдера из каталога'
                            example: openai
                        url:
                            type: string
                            example: 'https://api.openai.com/v1'
                        models:
                            type: array
                            description: 'Все модели реквизитов'
                            items:
                                type: string
                            example: ['gpt-4o', 'gpt-4o-mini']
                        defaultModel:
                            type: string
                            description: 'Дефолтная модель реквизитов'
                            example: gpt-4o
                        model:
                            type: string
                            description: 'Синоним `defaultModel` для обратной совместимости'
                            example: gpt-4o
                        apiKeyHint:
                            type: string
                            description: 'Маска ключа: последние 4 символа'
                            example: '****a1b2'
                        createdAt:
                            type: integer
                            description: Момент создания, unix timestamp (секунды)
                            example: 1762000000
                        updatedAt:
                            type: integer
                            description: Момент последнего изменения, unix timestamp (секунды)
                            example: 1762000000
                ProviderOpenCode:
                    type: object
                    description: 'Элемент каталога провайдеров OpenCode (ProvayderOpenCodeReadModel); список моделей запрашивается отдельно'
                    required: [code, name, baseUrl, modelsPath, authStyle, supportsModelList]
                    properties:
                        code:
                            type: string
                            description: 'Код провайдера; он же значение `provider` в реквизитах'
                            example: openai
                        name:
                            type: string
                            example: OpenAI
                        baseUrl:
                            type: string
                            description: 'Базовый URL для подстановки в реквизиты; пустой для `custom`'
                            example: 'https://api.openai.com/v1'
                        modelsPath:
                            type: string
                            description: 'Путь эндпоинта списка моделей относительно `baseUrl`'
                            example: /models
                        authStyle:
                            type: string
                            description: 'Схема авторизации: bearer, api_key_header или none'
                            example: bearer
                        supportsModelList:
                            type: boolean
                            description: 'Поддерживает ли провайдер live-запрос списка моделей'
                            example: true
                SpisokModelei:
                    type: object
                    description: 'Результат загрузки списка моделей (SpisokModeleiReadModel). При отсутствии live-списка или ошибке провайдера отдаётся пустой список, `source: manual` и `errorKey`, HTTP 200'
                    required: [provider, models, source, errorKey]
                    properties:
                        provider:
                            type: string
                            example: openai
                        models:
                            type: array
                            items:
                                type: string
                            example: ['gpt-4o', 'gpt-4o-mini']
                        source:
                            type: string
                            enum: [live, manual]
                            description: '`live` — список получен от провайдера, `manual` — провайдер не отдаёт список или запрос завершился ошибкой'
                            example: live
                        errorKey:
                            type: string
                            nullable: true
                            description: 'Ключ перевода ошибки провайдера; null при успехе'
                            example: account.opencode_credential.provider_unavailable
                        providerStatus:
                            type: integer
                            nullable: true
                            description: 'HTTP-статус ответа провайдера; null, если ответа не было (сеть, таймаут) или список не запрашивался'
                            example: 403
                # --- OpenCode: сессии и ходы ---
                SozdatSessiyu:
                    type: object
                    description: 'Создание сессии OpenCode под выбранные реквизиты; сессию можно сразу привязать к существующим юнитам (`unitIds`) либо создать один новый юнит вместе с ней (`unit`)'
                    required: [credentialId]
                    properties:
                        credentialId:
                            type: string
                            format: uuid
                            description: 'Идентификатор реквизитов из /api/account/opencode (обязателен: ключ выбирает пользователь)'
                        title:
                            type: string
                            maxLength: 255
                            nullable: true
                            description: 'Необязательный заголовок сессии; при пустом значении подставляется по первому промпту'
                            example: 'Рефакторинг модуля биллинга'
                        unitIds:
                            type: array
                            maxItems: 10
                            uniqueItems: true
                            description: 'Существующие юниты пользователя: сессия сразу привязывается к ним. Порядок сохраняется, первый юнит — рабочий каталог хода (cwd), остальные передаются раннеру как дополнительные корни workspace. Не более одного юнита на проект: вторая привязка юнита того же проекта даёт `opencode.session.unit_project_conflict`. Нельзя указывать одновременно с `unit`'
                            items:
                                type: string
                                format: uuid
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                            description: 'Модель из набора реквизитов; пустое значение — дефолтная модель реквизитов. Недопустимая модель даёт `account.opencode_credential.model_not_available`'
                            example: gpt-4o
                        unit:
                            description: 'Параметры нового юнита: он создаётся от имени владельца сессии по логике процессов Unitman. Нельзя указывать одновременно с `unitIds`'
                            allOf:
                                - $ref: '#/components/schemas/SozdatSessiyuUnit'
                SozdatSessiyuUnit:
                    type: object
                    description: 'Параметры юнита, создаваемого вместе с сессией (ParametriSozdaniyaUnita). Отличается от `SozdatUnit` именем поля переменных: `peremenie` вместо `znacheniePeremenoi`'
                    required: [projectId, unitName, branch]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        unitName:
                            type: string
                            example: feature-123
                        branch:
                            type: string
                            example: feature/123
                        memoryLimit:
                            type: integer
                            example: 0
                        peremenie:
                            type: array
                            description: 'Переменные конфига юнита'
                            items:
                                $ref: '#/components/schemas/ZnacheniePeremenoi'
                        volumes:
                            type: array
                            description: 'Тома юнита. Значения `dir` и `name` берутся из ответа `poluchitKonfigIzHranilisha`, `fileId` — идентификатор файла из медиатеки (может отсутствовать)'
                            items:
                                $ref: '#/components/schemas/SozdatUnitVolume'
                NachatPrompt:
                    type: object
                    description: 'Промпт пользователя, запускающий новый ход'
                    required: [sessionId, text]
                    properties:
                        sessionId:
                            type: string
                            format: uuid
                        text:
                            type: string
                            minLength: 1
                            description: 'Текст промпта в открытом виде'
                            example: 'Добавь ретраи в клиент оплаты'
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                            description: 'Переопределение модели перед ходом; приоритет: запрос → модель сессии → дефолт реквизитов'
                            example: gpt-4o-mini
                OtvetitNaVopros:
                    type: object
                    description: 'Ответ на вопросы предыдущего хода; запускает новый ход'
                    required: [turnId, answers]
                    properties:
                        turnId:
                            type: string
                            format: uuid
                            description: 'Ход в статусе AWAITING_INPUT'
                        answers:
                            type: array
                            minItems: 1
                            description: 'Ответы по каждому вопросу хода'
                            items:
                                $ref: '#/components/schemas/OpenCodeAnswer'
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                            description: 'Переопределение модели для нового хода; приоритет: запрос → модель сессии → дефолт реквизитов'
                            example: gpt-4o-mini
                OpenCodeAnswer:
                    type: object
                    description: 'Ответ на один вопрос: выбранный вариант и/или свободный текст'
                    required: [questionId]
                    properties:
                        questionId:
                            type: string
                            description: 'Id вопроса из result.Questions предыдущего хода'
                        optionId:
                            type: string
                            nullable: true
                            description: 'Id выбранного варианта; обязателен, если вопрос не допускает свободный текст'
                        text:
                            type: string
                            nullable: true
                            description: 'Свободный текстовый ответ; допустим только при AllowFreeText'
                PoluchitResultatHoda:
                    type: object
                    required: [turnId]
                    properties:
                        turnId:
                            type: string
                            format: uuid
                PoluchitProgressHoda:
                    type: object
                    required: [turnId]
                    properties:
                        turnId:
                            type: string
                            format: uuid
                PoluchitIstoriyuSessii:
                    type: object
                    required: [sessionId]
                    properties:
                        sessionId:
                            type: string
                            format: uuid
                PrivezatKUnitu:
                    type: object
                    description: 'Привязка сессии к существующим юнитам (дополняет уже привязанные): после привязки ходы выполняются в директории первого юнита, остальные юниты становятся дополнительными корнями workspace. В сессии может быть только один юнит на проект'
                    required: [sessionId, unitIds]
                    properties:
                        sessionId:
                            type: string
                            format: uuid
                        unitIds:
                            type: array
                            minItems: 1
                            maxItems: 10
                            uniqueItems: true
                            description: 'Юниты пользователя: должны существовать и быть доступны по проекту. Уже привязанные к сессии юниты повторно не добавляются (привязка идемпотентна). Если проект юнита уже представлен в сессии, запрос отклоняется с `opencode.session.unit_project_conflict` и состав сессии не меняется'
                            items:
                                type: string
                                format: uuid
                ArhivirovatSessiyu:
                    type: object
                    description: 'Архивация сессии: ходы и история сохраняются, сессия остаётся в списке с флагом `archived`, новые ходы запрещены'
                    required: [sessionId]
                    properties:
                        sessionId:
                            type: string
                            format: uuid
                PoluchitSostoyanieSessii:
                    type: object
                    description: 'Запрос состояния сессии: причина блокировки ходов'
                    required: [sessionId]
                    properties:
                        sessionId:
                            type: string
                            format: uuid
                SostoyanieSessii:
                    type: object
                    description: 'Состояние сессии для интерфейса (SostoyanieSessiiReadModel); правило `canAcceptMessages` совпадает с гейтом старта хода'
                    required: [sessionId, units, archived, canAcceptMessages]
                    properties:
                        sessionId:
                            type: string
                            format: uuid
                        units:
                            type: array
                            description: 'Состояние всех юнитов сессии в порядке привязки: первый — рабочий каталог хода (cwd), остальные — дополнительные корни workspace'
                            items:
                                $ref: '#/components/schemas/SostoyanieUnitaSessii'
                        unitId:
                            type: string
                            format: uuid
                            nullable: true
                            description: 'Первый юнит сессии (cwd); `null` — свободная сессия'
                        unitProjectId:
                            type: string
                            format: uuid
                            nullable: true
                            description: 'Проект первого юнита сессии'
                        archived:
                            type: boolean
                            description: 'Сессия в архиве: новые ходы запрещены'
                        archiveReason:
                            type: string
                            nullable: true
                            enum: [manual, unit_deleted]
                            description: 'Причина архивации: `manual` — пользователь, `unit_deleted` — все юниты сессии удалены'
                        unitStateCode:
                            type: string
                            nullable: true
                            example: USPESHNO_ZAPUSHEN
