                    type: object
                    description: Страница событий webhook
                    required: [list, totalRecords]
                    properties:
                        list:
                            type: array
                            items:
                                $ref: '#/components/schemas/WebhookEvent'
                        totalRecords:
                            type: integer
                            example: 42
                ProjectRunnerJob:
                    type: object
                    description: Задание раннера по проекту без шагов (ProjectRunnerJobWithoutSteps)
                    required: [id, projectId, jobType, success]
                    properties:
                        id:
                            type: string
                        projectId:
                            type: string
                        jobType:
                            type: string
                            enum: [SBORKA_PROEKTA, UDALENIE_PROEKTA, OCHISTKA_PROEKTA]
                        success:
                            type: boolean
                ProjectRunnerJobDetailed:
                    type: object
                    description: Задание раннера по проекту с шагами (ProjectRunnerJob)
                    required: [id, projectId, jobType, success, steps]
                    properties:
                        id:
                            type: string
                        projectId:
                            type: string
                        jobType:
                            type: string
                            enum: [SBORKA_PROEKTA, UDALENIE_PROEKTA, OCHISTKA_PROEKTA]
                        success:
                            type: boolean
                        steps:
                            type: array
                            items:
                                $ref: '#/components/schemas/RunnerJobStep'
                RunnerJobStep:
                    type: object
                    description: >-
                        Шаг выполнения задания (RunnerJobStep::toArray).
                        `unixtime` — время окончания шага, `unixtimeStart` — необязательное
                        время начала. Ключ `unixtimeStart` не эмитится, если время начала
