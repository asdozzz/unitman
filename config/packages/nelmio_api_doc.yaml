                        targetUnitId:
                            type: string
                            description: Идентификатор юнита, выбранного через хелпер
                        projectId:
                            type: string
                            description: Идентификатор проекта целевого юнита (денормализован для фильтрации списка)
                        service:
                            type: string
                            nullable: true
                            description: Сервис из конфигурации хелпера переменной
                        port:
                            type: integer
                            nullable: true
                            description: Порт из конфигурации хелпера переменной
                        suffix:
                            type: string
                            nullable: true
                            description: Суффикс из конфигурации хелпера переменной
                        type:
                            type: string
                            nullable: true
                            description: Протокол из конфигурации хелпера переменной; по умолчанию `http`
                            example: ws
                UnitAction:
                    type: object
                    description: Действие, доступное для юнита (KonfigDeistviya::toArray)
                    required: [id, name, variables, commands, prepare]
                    properties:
                        id:
                            type: string
                        name:
                            type: string
                        variables:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitActionVariable'
                        commands:
                            type: array
                            items:
                                type: string
                        prepare:
                            type: boolean
                UnitActionVariable:
                    type: object
                    required: [id, label, type, defaultValue, options, helper]
                    properties:
                        id:
                            type: string
                        label:
                            type: string
                        type:
                            type: string
                            enum: [string, integer, float, collection]
                        defaultValue:
                            type: string
                        options:
                            type: object
                            nullable: true
                        helper:
                            type: object
                            nullable: true
                ContainerStats:
                    type: object
                    description: Статистика контейнера юнита
                    required: [cpuPercent, memoryPercent, memoryUsage, netIO]
                    properties:
                        cpuPercent:
                            type: string
