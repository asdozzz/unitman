                        projectId:
                            type: string
                            format: uuid
                        code:
                            type: string
                            maxLength: 100
                            description: Код типа тома; должен совпадать с `dir` тома
                            example: config
                        name:
                            type: string
                            maxLength: 255
                            example: Конфигурация
                DeleteVolumeType:
                    type: object
                    required: [projectId, code]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        code:
                            type: string
                            maxLength: 100
                            description: Код типа тома. Удаление запрещено, если к типу привязаны архивы
                            example: config
                AddVolumeTypeFile:
                    type: object
                    required: [projectId, code, fileId]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        code:
                            type: string
                            maxLength: 100
                            example: config
                        fileId:
                            type: string
                            format: uuid
                            description: Идентификатор архива проекта, загруженного в медиатеку
                DeleteVolumeTypeFile:
                    type: object
                    required: [projectId, code, fileId]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        code:
                            type: string
                            maxLength: 100
                            example: config
                        fileId:
                            type: string
                            format: uuid
                        udalitFayl:
                            type: boolean
                            default: false
                            description: Если true — файл удаляется из медиатеки вместе с отвязкой (при условии, что он не привязан к другим типам)
                # --- Unitman: процессы юнита без шагов задач ---
                UnitProcessBrief:
                    type: object
                    description: Процесс юнита без шагов задач (ProzesUnitaBezShagov)
                    required: [id, unitId, userId, type, state, jobs]
                    properties:
                        id:
                            type: string
                        unitId:
                            type: string
                        userId:
                            type: string
                        type:
                            type: string
                            enum: [SBORKA, OBNOVLENIE, PODGOTOVKA, ZAPUSK, OSTANOVKA, SBROS_PODGOTOVKI, UDALENIE, DEISTVIE]
                        state:
                            type: string
                            enum: [NEW, ZADACHI_DOBAVLENI, PENDING, SUCCESS, ERROR, CANCLED]
                        jobs:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitProcessBriefJob'
                UnitProcessBriefJob:
                    type: object
                    description: Задача процесса юнита без шагов (ZadachaProzesaUnitaBezShagovZadachi)
                    required: [id, type, state]
                    properties:
                        id:
                            type: string
                        type:
                            type: string
                            enum: [SBORKA, OBNOVLENIE, PODGOTOVKA, ZAPUSK, OSTANOVKA, SBROS_PODGOTOVKI, UDALENIE, DEISTVIE]
                        state:
                            type: string
                            enum: [NEW, PENDING, CANCLED, SUCCESS, ERROR]
                # --- Unitman: проекты ---
                ProjectListItem:
                    type: object
                    description: Проект (read-модель ProjectList)
                    required: [id, repoId, code, name, mainBranch, isActive, state, nastroikiHukaProekta, users, variables, waitResultRunner, memoryLimit, zashishennieVetki]
                    properties:
                        id:
                            type: string
                            format: uuid
                        repoId:
                            type: string
                        code:
                            type: string
                            example: my-app
                        name:
                            type: string
                            example: my-app
                        mainBranch:
                            type: string
                            example: master
                        isActive:
                            type: boolean
                        state:
                            type: string
                            enum: [NEW, REMOVE_PENDING, REMOVE_ERROR]
                        nastroikiHukaProekta:
                            $ref: '#/components/schemas/ProjectHookSettings'
                        users:
                            type: array
                            items:
                                $ref: '#/components/schemas/ProjectUser'
                        variables:
                            type: array
                            items:
                                $ref: '#/components/schemas/ProjectVariable'
                        waitResultRunner:
                            type: boolean
                        memoryLimit:
                            type: integer
                            example: 3072
                        zashishennieVetki:
                            type: array
                            description: Список масок защищённых веток (wildcard * как в GitLab)
                            items:
                                type: string
                            example: ['main', 'release/*']
                ProjectHookSettings:
                    type: object
                    description: Настройки webhook проекта (NastroikiHukaProekta)
                    required: [avtosozdanie, avtoobnovlenie, avtoudalenie, obnovlenieBezSbrosaPodgotovki, vebhukNastroen]
                    properties:
                        avtosozdanie:
                            type: boolean
                        avtoobnovlenie:
                            type: boolean
                        avtoudalenie:
                            type: boolean
                        obnovlenieBezSbrosaPodgotovki:
                            type: boolean
                        vebhukNastroen:
                            type: boolean
                            description: >-
                                Git-вебхук проекта уже присылал валидное событие.
                                Пока false, Unitman сам опрашивает ветки репозитория.
                            example: false
                ProjectUser:
                    type: object
                    description: Пользователь проекта (ProjectUsersList)
                    required: [userId, role]
                    properties:
                        userId:
                            type: string
                        role:
                            type: string
                ProjectVariable:
                    type: object
                    description: Переменная проекта (ProjectListVariable)
                    required: [tip, code, value]
                    properties:
                        tip:
                            type: string
                        code:
                            type: string
                        value:
                            type: string
                ProjectBranch:
                    type: object
                    description: Ветка проекта (VetkaProekta)
                    required: [name]
                    properties:
                        name:
                            type: string
                            example: feature/123
                ProjectWebhook:
                    type: object
                    description: Webhook проекта (ProjectWebhookReadModel)
                    required: [id, projectId, url, isActive]
                    properties:
                        id:
                            type: string
                            format: uuid
                        projectId:
                            type: string
                        url:
                            type: string
                            format: uri
                        isActive:
                            type: boolean
                WebhookEvent:
                    type: object
                    description: Событие webhook (WebhookEventDlySpiska)
                    required: [id, type, payload, response, unixtime, sent]
                    properties:
                        id:
                            type: string
                        type:
                            type: string
                        payload:
                            type: string
                            description: JSON-строка тела события
                        response:
                            type: string
                            nullable: true
                        unixtime:
                            type: integer
                            example: 1730000000
                        sent:
                            type: boolean
