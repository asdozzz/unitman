nelmio_api_doc:
    documentation:
        openapi: 3.1.0
        info:
            title: Unitman API
            description: API сервиса автоматического создания тестовых стендов
            version: 1.0.0
        security:
            - bearerAuth: []
        tags:
            - name: Account
              description: Аккаунты, роли, настройки
            - name: Initialization
              description: Первичная инициализация системы
            - name: Runner
              description: Исполнитель сборки и запуска контейнеров
            - name: Project
              description: Проекты (Git-репозитории в Unitman)
            - name: Repo
              description: Учётные данные доступа к репозиториям
            - name: Webhook
              description: Webhook'и проектов
            - name: Unit
              description: Тестовые стенды
            - name: Mediateka
              description: Файлы юнитов (zip-архивы в MinIO)
        # Маршруты, которые создаются не контроллерами проекта, а бандлами
        # (lexik JSON-логин), поэтому описываются декларативно.
        paths:
            /api/login:
                post:
                    tags: [Account]
                    summary: Получить JWT-токен
                    description: JSON-логин (lexik/jwt-authentication-bundle). Токен затем передаётся в заголовке Authorization.
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [username, password]
                                    properties:
                                        username:
                                            type: string
                                            format: email
                                            example: user@example.com
                                        password:
                                            type: string
                                            format: password
                                            example: secret
                    responses:
                        '200':
                            description: Токен выдан
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        required: [token, refreshToken]
                                        properties:
                                            token:
                                                type: string
                                                example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
                                            refreshToken:
                                                type: string
                                                description: Одноразовый токен для /api/account/refreshToken
                                                example: a1b2c3d4e5f6...
                                            user:
                                                $ref: '#/components/schemas/AccountLoginUser'
                        '401':
                            description: Неверные учётные данные
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                SuccessEnvelope:
                    type: object
                    description: Успешный ответ (App\Utils\Model\Reponse\SuccessResponse)
                    required: [status, data]
                    properties:
                        status:
                            type: string
                            enum: [success]
                            example: success
                        data:
                            type: object
                            nullable: true
                FailEnvelope:
                    type: object
                    description: Ожидаемая ошибка (App\Utils\Model\Reponse\FailResponse)
                    required: [status, data]
                    properties:
                        status:
                            type: string
                            enum: [fail]
                            example: fail
                        data:
                            type: object
                            nullable: true
                ErrorEnvelope:
                    type: object
                    description: Ошибка (App\Utils\Model\Reponse\ErrorResponse), возвращается с HTTP 200
                    required: [status, message, code]
                    properties:
                        status:
                            type: string
                            enum: [error]
                            example: error
                        message:
                            type: string
                            example: Недостаточно прав
                        code:
                            type: string
                            enum: [DEFAULT, LOCK]
                            example: DEFAULT
                # Тела запросов, привязываемые через JsonBodySerializableInterface.
                # Nelmio читает атрибуты только с контроллера, поэтому DTO-схемы описаны здесь.
                RegisterAccount:
                    type: object
                    required: [email, password, roles, locale]
                    properties:
                        email:
                            type: string
                            format: email
                            example: user@example.com
                        password:
                            type: string
                            format: password
                            example: secret
                        roles:
                            type: string
                            description: В коде объявлено строкой, а не массивом
                            example: ROLE_USER
                        locale:
                            type: string
                            example: ru
                        nickname:
                            type: string
                            nullable: true
                            example: nickname
                ChangeEmailByAdmin:
                    type: object
                    required: [accountId, newEmail]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newEmail:
                            type: string
                            format: email
                            example: user@example.com
                ChangeNicknameByAdmin:
                    type: object
                    required: [accountId, newNickname]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newNickname:
                            type: string
                            example: nickname
                ChangePasswordByAdmin:
                    type: object
                    required: [accountId, newPassword]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newPassword:
                            type: string
                            format: password
                ChangeRoleByAdmin:
                    type: object
                    required: [accountId, newRole]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        newRole:
                            type: string
                            example: ROLE_USER
                ChangeMyLocale:
                    type: object
                    required: [locale]
                    properties:
                        locale:
                            type: string
                            example: ru
                ChangeMyNickname:
                    type: object
                    required: [newNickname]
                    properties:
                        newNickname:
                            type: string
                            example: nickname
                ChangeMyPassword:
                    type: object
                    required: [newPassword]
                    properties:
                        newPassword:
                            type: string
                            format: password
                ObnovitToken:
                    type: object
                    required: [refreshToken]
                    properties:
                        refreshToken:
                            type: string
                            description: Ранее выданный refresh-токен (одноразовый)
                            example: a1b2c3d4e5f6...
                AccountLoginUser:
                    type: object
                    description: Данные аутентифицированного пользователя в ответе /api/login
                    properties:
                        id:
                            type: string
                            format: uuid
                        email:
                            type: string
                            format: email
                        roles:
                            type: array
                            items:
                                type: string
                            example: [ROLE_USER]
                        locale:
                            type: string
                            example: ru
                BlockByAdmin:
                    type: object
                    required: [accountId]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        reason:
                            type: string
                            nullable: true
                            example: Нарушение правил
                UnblockByAdmin:
                    type: object
                    required: [accountId]
                    properties:
                        accountId:
                            type: string
                            format: uuid
                        reason:
                            type: string
                            nullable: true
                            example: Апелляция удовлетворена
                ObnovitDefoltnyiProxyHost:
                    type: object
                    required: [value]
                    properties:
                        value:
                            type: string
                            nullable: true
                            example: http://proxy.example
                SaveStepsCommand:
                    type: object
                    required: [responseId, stepsContent]
                    properties:
                        responseId:
                            type: string
                            example: b5f1f0c4-6d1e-4a1e-9a3b-1c2d3e4f5a6b
                        stepsContent:
                            type: string
                            example: '{}'
                # --- Unitman: webhook'и проектов ---
                SozdatWebhookProekta:
                    type: object
                    required: [projectId, url]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        url:
                            type: string
                            format: uri
                            example: https://gitlab.example/hook
                IzmenitUrlWebhooka:
                    type: object
                    required: [id, newUrl]
                    properties:
                        id:
                            type: string
                            format: uuid
                        newUrl:
                            type: string
                            format: uri
                            example: https://gitlab.example/hook
                PoluchitSobitiyaWebhooka:
                    type: object
                    required: [webhookId, limit, offset]
                    properties:
                        webhookId:
                            type: string
                            format: uuid
                        limit:
                            type: integer
                            example: 20
                        offset:
                            type: integer
                            example: 0
                # --- Unitman: юниты ---
                ZnacheniePeremenoi:
                    type: object
                    required: [id, value, type]
                    properties:
                        id:
                            type: string
                        value:
                            type: string
                        type:
                            type: string
                            example: string
                        targetUnitId:
                            type: string
                            nullable: true
                            description: Идентификатор юнита, выбранного пользователем через хелпер переменной. Для переменных без хелпера игнорируется; `null` — хелпер не использовался
                SvyazPeremenoi:
                    type: object
                    description: Связь переменной конфига юнита с юнитом, выбранным через хелпер
                    required: [variableId, targetUnitId]
                    properties:
                        variableId:
                            type: string
                            description: Идентификатор переменной конфига юнита
                        targetUnitId:
                            type: string
                            description: Идентификатор выбранного юнита. Должен существовать, быть доступен по проекту и отличаться от самого юнита
                SozdatUnit:
                    type: object
                    required: [projectId, unitName, branch]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        unitName:
                            type: string
                            example: feature-123
                        branch:
                            type: string
                            example: feature/123
                        memoryLimit:
                            type: integer
                            example: 0
                        znacheniePeremenoi:
                            type: array
                            items:
                                $ref: '#/components/schemas/ZnacheniePeremenoi'
                        volumes:
                            type: array
                            description: Тома юнита. Значения `dir` и `name` берутся из ответа `poluchitKonfigIzHranilisha`, `fileId` — идентификатор файла из медиатеки (может отсутствовать)
                            items:
                                $ref: '#/components/schemas/SozdatUnitVolume'
                SozdatUnitVolume:
                    type: object
                    required: [dir, name]
                    properties:
                        dir:
                            type: string
                            example: /var/www/uploads
                        name:
                            type: string
                            example: uploads
                        fileId:
                            type: string
                            format: uuid
                            nullable: true
                            description: 'Идентификатор файла из медиатеки: либо черновик, загруженный пользователем, либо архив каталога проекта, привязанный к типу тома с `code` = `dir`. Арбитражные файлы проекта отклоняются. Если не передан — том описывает каталог без файла'
                NaitiDubliUnita:
                    type: object
                    required: [projectId, branch]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        branch:
                            type: string
                            example: feature/123
                GetUnitReadModelById:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                # Описывается вручную, чтобы `unitIds` остался строгим
                # `array<string>`: выводимая из DTO схема разворачивает
                # нетипизированный `array` в `oneOf(array, object)`.
                GetUnitListFilter:
                    type: object
                    properties:
                        onlyMine:
                            type: boolean
                            default: false
                            description: Вернуть только юниты текущего пользователя
                        name:
                            type: string
                            nullable: true
                            default: null
                            description: Подстрока имени юнита
                        branch:
                            type: string
                            nullable: true
                            default: null
                            description: Подстрока имени ветки
                        projectId:
                            type: string
                            nullable: true
                            default: null
                            description: Ограничить выборку одним проектом. Должен быть доступен пользователю, иначе результат пустой
                        unitId:
                            type: string
                            nullable: true
                            default: null
                            description: Идентификатор конкретного юнита
                        unitIds:
                            type: array
                            default: []
                            description: Вернуть переданные юниты и связанные с ними (связи через хелпер переменной, в обе стороны)
                            items:
                                type: string
                GetMyUnits:
                    type: object
                    properties:
                        limit:
                            type: integer
                            example: 10
                        offset:
                            type: integer
                            example: 0
                SobratUnit:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                ObnovitKodUnita:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                ZapolnitPeremenieUnita:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                        values:
                            type: array
                            description: Список заполняемых переменных юнита. Можно не передавать, если заполняются только тома
                            items:
                                $ref: '#/components/schemas/ZnacheniePeremenoi'
                        volumes:
                            type: array
                            description: Тома юнита, которые нужно заполнить. `dir` обязан присутствовать в блоке `unitman_volumes` конфига юнита; имя тома берётся из конфига
                            items:
                                $ref: '#/components/schemas/ZapolnitPeremenieUnitaVolume'
                        svyazi:
                            type: array
                            description: Связи переменных с юнитами, выбранными через хелпер. Пустой массив — связи не меняются; непустой список — полная замена набора связей юнита
                            items:
                                $ref: '#/components/schemas/SvyazPeremenoi'
                ZapolnitPeremenieUnitaVolume:
                    type: object
                    required: [dir]
                    properties:
                        dir:
                            type: string
                            description: Уникальный ключ тома из блока `unitman_volumes`
                            example: config
                        fileId:
                            type: string
                            format: uuid
                            nullable: true
                            description: Идентификатор архива, загруженного в медиатеку. Если поле не передано — текущий файл тома сохраняется; `null` — файл тома очищается
                PodgotovitUnitKZapusku:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                SbrositPodgotovkuUnita:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                ZapustitUnit:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                OstanovitUnit:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                UdalitUnit:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                UdalitSlomaniyUnit:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                PoluchitKonfigUnita:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                PoluchitPeremenieUnita:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                PoluchitSsylkuPoPomoschniku:
                    type: object
                    required: [projectId, service, port, targetUnitId]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        service:
                            type: string
                            example: backend
                        port:
                            type: integer
                            example: 8080
                        targetUnitId:
                            type: string
                            format: uuid
                        suffix:
                            description: Суффикс, подставляемый в конец ссылки вместо startUri из конфига юнита; null или пустая строка — ссылка без суффикса
                            type: string
                            nullable: true
                            example: /api/v1
                        type:
                            description: Протокол искомого порта целевого юнита; null или пустая строка — `http`
                            type: string
                            nullable: true
                            example: ws
                GetUnitRunnerJobs:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                PoluchitShagiZadachiUnita:
                    type: object
                    required: [prozesId, zadachaId]
                    properties:
                        prozesId:
                            type: string
                        zadachaId:
                            type: string
                VipolnitDeistviye:
                    type: object
                    required: [id, actionId, values]
                    properties:
                        id:
                            type: string
                            format: uuid
                        actionId:
                            type: string
                        values:
                            type: array
                            description: Параметры выполняемого действия
                            items:
                                $ref: '#/components/schemas/ZnacheniePeremenoi'
                ProveritKonteinerUnita:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                PoluchitKonfigIzHranilisha:
                    type: object
                    required: [projectId, branch]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                        branch:
                            type: string
                            example: feature/123
                PeresobratModelSpisokUnitov:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                PometitKakSlomanii:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                # --- Unitman: ответы со списком/карточкой юнита ---
                # Единая схема элемента, которую возвращают /api/unit/list, /api/unit/moi
                # (массив) и /api/unit/obnovit (один объект). Источник полей —
                # SpisokUnitovReadModel и проекция SpisokUnitovProjection.
                UnitListItem:
                    type: object
                    description: Элемент списка юнитов (payload read-модели spisok_unitov)
                    required: [id, authorId, authorName, name, projectId, projectName, branch, commands, prozesi, error, zapushen, links, peremenie, unitSozdanSystemoi, deistviya]
                    properties:
                        id:
                            type: string
                            format: uuid
                        authorId:
                            type: string
                        authorName:
                            type: string
                            description: Email или никнейм автора юнита
                            example: user@example.com
                        name:
                            type: string
                            example: feature-123
                        projectId:
                            type: string
                        projectName:
                            type: string
                            example: my-app
                        branch:
                            type: string
                            example: feature/123
                        commands:
                            type: array
                            description: Команды, доступные пользователю в текущем состоянии юнита
                            items:
                                type: string
                                enum: [nachatSborku, nachatObnovlenie, zapolnitPeremenie, nachatPodgotovku, ustanovitResultatPodgotovki, nachatSbrosPodgotovki, nachatZapusk, nachatOstanovku, nachatUdalenie, udalitVruchnuyu, nachatObnovleniePosleZapuska, nachatUdaleniePosleZapuska, vipolnitDeistvie, ustanovitResultatDeistviya, proveritKonteinerUnita]
                        prozesi:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitProcess'
                        error:
                            type: boolean
                        zapushen:
                            type: boolean
                        links:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitLink'
                        unixtimePoslednegoObnovleniyaUnita:
                            type: integer
                            nullable: true
                            example: 1730000000
                        unixtimePoslednegoObnovleniyaVHranilishe:
                            type: integer
                            nullable: true
                            example: 1730000000
                        peremenie:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitVariableValue'
                        unitSozdanSystemoi:
                            type: boolean
                        deistviya:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitAction'
                        svyazi:
                            type: array
                            description: Связи переменных юнита с юнитами, выбранными через хелпер. Заполняется из проекции `svyazi_unitov` и реконсилируется при изменении конфига
                            items:
                                $ref: '#/components/schemas/UnitSvyaz'
                        statistikaKonteinera:
                            oneOf:
                                - $ref: '#/components/schemas/ContainerStats'
                                - type: 'null'
                UnitProcess:
                    type: object
                    description: Процесс юнита (UnitProcess::toArray)
                    required: [id, userId, type, state, jobs]
                    properties:
                        id:
                            type: string
                        unitId:
                            type: string
                            description: Объявлено в read-модели, но проекция сохраняет процесс без этого поля
                        userId:
                            type: string
                        type:
                            type: string
                            enum: [SBORKA, OBNOVLENIE, PODGOTOVKA, ZAPUSK, OSTANOVKA, SBROS_PODGOTOVKI, UDALENIE, DEISTVIE]
                        state:
                            type: string
                            enum: [NEW, ZADACHI_DOBAVLENI, PENDING, SUCCESS, ERROR, CANCLED]
                        jobs:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitProcessJob'
                UnitProcessJob:
                    type: object
                    required: [id, type, state, steps]
                    properties:
                        id:
                            type: string
                        type:
                            type: string
                            enum: [SBORKA, OBNOVLENIE, PODGOTOVKA, ZAPUSK, OSTANOVKA, SBROS_PODGOTOVKI, UDALENIE, DEISTVIE]
                        state:
                            type: string
                            enum: [NEW, PENDING, CANCLED, SUCCESS, ERROR]
                        steps:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitProcessJobStep'
                UnitProcessJobStep:
                    type: object
                    required: [command, response, success, unixtime]
                    properties:
                        command:
                            type: string
                        response:
                            type: string
                        success:
                            type: boolean
                        unixtime:
                            type: integer
                            example: 1730000000
                UnitLink:
                    type: object
                    description: Ссылка на сервис запущенного юнита
                    required: [service, path, port, protocol]
                    properties:
                        service:
                            type: string
                            example: backend
                        path:
                            type: string
                            example: http://8080.feature-123.my-app.proxy.example
                        port:
                            type: integer
                            example: 8080
                        protocol:
                            type: string
                            example: http
                        startUri:
                            type: string
                            nullable: true
                            example: /api/health
                UnitVariableValue:
                    type: object
                    required: [id, value]
                    properties:
                        id:
                            type: string
                        value:
                            type: string
                UnitSvyaz:
                    type: object
                    description: Связь переменной юнита с юнитом, выбранным через хелпер (проекция svyazi_unitov)
                    required: [variableId, targetUnitId, projectId]
                    properties:
                        variableId:
                            type: string
                            description: Идентификатор переменной конфига юнита, для которой использован хелпер
                        targetUnitId:
                            type: string
                            description: Идентификатор юнита, выбранного через хелпер
                        projectId:
                            type: string
