                            example: unitman-runner-queue
                        active:
                            type: boolean
                        dockerStats:
                            type: array
                            items:
                                $ref: '#/components/schemas/RunnerContainerStats'
                        memoryInfo:
                            $ref: '#/components/schemas/RunnerMemoryInfo'
                RunnerContainerStats:
                    type: object
                    description: Статистика контейнера раннера (DockerContainerStats)
                    required: [containerId, containerName, cpuPercent, memoryPercent, memoryUsage, netIO]
                    properties:
                        containerId:
                            type: string
                        containerName:
                            type: string
                        cpuPercent:
                            type: string
                            example: '12.5'
                        memoryPercent:
                            type: string
                            example: '34.1'
                        memoryUsage:
                            type: string
                            example: 120MiB / 512MiB
                        netIO:
                            type: string
                            example: 1.2kB / 3.4kB
                RunnerMemoryInfo:
                    type: object
                    description: Информация о памяти раннера (MemoryInfo)
                    required: [totalAsKb, freeAsKb]
                    properties:
                        totalAsKb:
                            type: integer
                            example: 16777216
                        freeAsKb:
                            type: integer
                            example: 8388608
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
