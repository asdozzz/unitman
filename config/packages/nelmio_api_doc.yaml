                        memoryPercent:
                            type: string
                            example: '34.1'
                        memoryUsage:
                            type: string
                            example: 120MiB / 512MiB
                        netIO:
                            type: string
                            example: 1.2kB / 3.4kB
                # --- Unitman: конфигурация юнита (ConfigUnita::toArray) ---
                UnitConfig:
                    type: object
                    description: Конфигурация юнита; пустой массив, если конфигурация ещё не задана
                    required: [variables, prepare, reset_prepare, up, down, services, actions, unitman_volumes]
                    properties:
                        variables:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitConfigVariable'
                        prepare:
                            type: array
                            items:
                                type: string
                        reset_prepare:
                            type: array
                            items:
                                type: string
                        up:
                            type: array
                            items:
                                type: string
                        down:
                            type: array
                            items:
                                type: string
                        services:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitConfigService'
                        actions:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitAction'
                        unitman_volumes:
                            type: array
                            description: Тома юнита. `dir` — уникальный ключ тома. Файл тома (zip-архив) загружается в медиатеку, его ид передаётся в `volumes` при создании юнита или в `zapolnitPeremenie`
                            items:
                                $ref: '#/components/schemas/UnitVolumeConfig'
                UnitConfigService:
                    type: object
                    description: Сервис юнита (KonfigServisa::toArray)
                    required: [name, ports]
                    properties:
                        name:
                            type: string
                            nullable: true
                            example: backend
                        ports:
                            type: array
                            items:
                                $ref: '#/components/schemas/UnitConfigServicePort'
                UnitConfigServicePort:
                    type: object
                    description: Порт сервиса (PortServisa::toArray)
                    required: [type, port, startUri]
                    properties:
                        type:
                            type: string
                            nullable: true
                            example: http
                        port:
                            type: integer
                            nullable: true
                            example: 8080
                        startUri:
                            type: string
                            nullable: true
                            example: /api/health
                UnitConfigVariable:
                    type: object
                    description: Переменная конфигурации юнита (AbstractConfigVariable::toArray)
                    required: [id, label, type, defaultValue, options, helper]
                    properties:
                        id:
                            type: string
                        label:
                            type: string
                        type:
                            type: string
                            enum: [string, integer, float, collection]
                        defaultValue:
                            type: string
                        options:
                            description: Параметры выбора; пустой объект, если опций нет
                            type: object
                            nullable: true
                        helper:
                            description: Помощник подстановки ссылки на сервис другого юнита, null если не задан
                            oneOf:
                                - $ref: '#/components/schemas/ConfigVariableHelper'
                                - type: 'null'
                ConfigVariableHelper:
                    type: object
                    description: Помощник ссылки (PomoschnikSsylki::toArray)
                    required: [projectId, service, port, suffix, type]
                    properties:
                        projectId:
                            type: string
                            nullable: true
                        service:
                            type: string
                            nullable: true
                        port:
                            type: integer
                            nullable: true
                        suffix:
                            description: Суффикс, добавляемый в конец ссылки на юнит, null если не задан
                            type: string
                            nullable: true
                        type:
                            description: Протокол ссылки на сервис; по умолчанию `http`, для websocket — `ws`
                            type: string
                            example: http
                UnitVariable:
                    type: object
                    description: Значение переменной юнита (PeremenyaUnita::toArray)
                    required: [konfig, value]
                    properties:
                        konfig:
                            $ref: '#/components/schemas/UnitConfigVariable'
                        value:
                            type: string
                UnitVolume:
                    type: object
                    description: Том юнита — описание из блока unitman_volumes плюс привязанный файл медиатеки (UnitVolume::toArray)
                    required: [dir, name, fileId]
                    properties:
                        dir:
                            type: string
                            description: Уникальный ключ тома внутри контейнера юнита; соответствует `code` типа тома в каталоге проекта
                            example: config
                        name:
                            type: string
                            description: Имя тома
                            example: config-volume
                        fileId:
                            type: string
                            format: uuid
                            nullable: true
                            description: Идентификатор привязанного файла медиатеки (черновик юнита либо архив каталога проекта); null, пока файл не загружен
                UnitVolumeConfig:
                    type: object
                    description: Описание тома из блока unitman_volumes в конфиге юнита (VolumeConfig::toArray)
                    required: [dir, name]
                    properties:
                        dir:
                            type: string
                            description: Уникальный ключ тома; соответствует `code` типа тома в каталоге проекта (`/api/volumeType/list`)
                            example: config
                        name:
                            type: string
                            example: config-volume
                # --- Unitman: каталог типов томов проекта ---
                VolumeTypeListRequest:
                    type: object
                    required: [projectId]
                    properties:
                        projectId:
                            type: string
                            format: uuid
                            description: Идентификатор проекта
                VolumeTypeList:
                    type: object
                    description: Тип тома проекта с привязанными архивами (VolumeTypeList::toArray)
                    required: [code, name, files]
                    properties:
                        code:
                            type: string
                            maxLength: 100
                            description: Код типа тома; должен совпадать с `dir` тома
                            example: config
                        name:
                            type: string
                            maxLength: 255
                            description: Отображаемое название типа
                            example: Конфигурация
                        files:
                            type: array
                            description: Архивы каталога, привязанные к типу
                            items:
                                $ref: '#/components/schemas/UnitmanVolumeTypeFile'
                UnitmanVolumeTypeFile:
                    type: object
