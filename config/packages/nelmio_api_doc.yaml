                    required: [command, response, success, unixtime]
                    properties:
                        command:
                            type: string
                        response:
                            type: string
                        success:
                            type: boolean
                        unixtime:
                            type: integer
                            description: Время окончания шага (unix-секунды)
                            example: 1730000000
                        unixtimeStart:
                            type: integer
                            nullable: true
                            description: >-
                                Необязательное время начала шага (unix-секунды).
                                Отсутствует, если раннер его не прислал; длительность
                                шага = unixtime - unixtimeStart (при наличии поля).
                            example: 1729999975
                RunnerJobProgress:
                    type: object
                    description: >-
                        Текущий прогресс задачи runner'а (RunnerJobProgress::toArray).
                        Совпадает по структуре с payload push-канала Centrifugo
                        `unit_progress#<jobId>`, поэтому фронтенд обрабатывает
                        push и pull одинаково.
                    required: [jobId, steps, finished, success, updatedAt]
                    properties:
                        jobId:
                            type: string
                            description: Идентификатор задачи (он же Temporal workflowId)
                        steps:
