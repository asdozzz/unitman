                            nullable: true
                            description: 'Идентификатор юнита, к которому прикреплён файл. null для черновика (загружен до создания юнита) и для архива каталога проекта'
                        projectId:
                            type: string
                            format: uuid
                            nullable: true
                            description: 'Идентификатор проекта-владельца. Заполняется для архива каталога томов проекта; null для черновика и файлов юнита. Ровно один владелец: unitId либо projectId'
                        name:
                            type: string
                            maxLength: 255
                            description: 'Имя файла, нормализованное под правила docker-тома: латиница в нижнем регистре, разрешены только a-z, 0-9, _, ., -, кириллица транслитерируется, расширение .zip добавляется при отсутствии'
                            example: logs.zip
                        size:
                            type: integer
                            minimum: 1
                            description: Размер файла в байтах
                            example: 1048576
                        mimeType:
                            type: string
                            enum: [application/zip]
                            example: application/zip
                        uploadedBy:
                            type: string
                            format: uuid
                            nullable: true
                            description: Идентификатор загрузившего пользователя
                        createdAt:
                            type: integer
                            description: Момент загрузки, unix timestamp (секунды)
                            example: 1762000000
                MediatekaFaylUnitaSoSsylkoy:
                    allOf:
                        - $ref: '#/components/schemas/MediatekaFaylUnita'
                        - type: object
                          required: [url]
                          properties:
                              url:
                                  type: string
                                  format: uri
                                  description: Подписанная (presigned) ссылка на скачивание из MinIO
                                  example: http://minio:9000/unitman-mediateka/units/1/file.zip?X-Amz-Signature=...
                # --- Вспомогательные тела ответов ---
                IdHolder:
                    type: object
                    description: Идентификатор созданной сущности
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
                EventIdHolder:
                    type: object
                    description: Идентификатор обработанного события webhook
                    required: [eventId]
                    properties:
                        eventId:
                            type: string
                UnitLinkHolder:
                    type: object
                    description: Ссылка на сервис юнита
                    required: [link]
                    properties:
                        link:
                            type: string
                            format: uri
                # --- Runner: диагностическое состояние ---
                RunnerState:
                    type: object
                    description: Состояние раннера (RunnerState::jsonSerialize)
                    required: [id, taskQueue, active, dockerStats, memoryInfo]
                    properties:
                        id:
                            type: string
                        taskQueue:
                            type: string
                            description: Всегда строго равен `id` зарегистрированного раннера.
                            example: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
                        active:
                            type: boolean
                        dockerStats:
                            type: array
                            items:
                                $ref: '#/components/schemas/RunnerContainerStats'
                        memoryInfo:
                            $ref: '#/components/schemas/RunnerMemoryInfo'
                        publicAddress:
                            type: string
                            format: uri
                            nullable: true
                            description: Публичный адрес раннера, заданный администратором. `null` — не задан.
                        registeredAt:
                            type: integer
                            nullable: true
                            description: Unix-время регистрации (контракт v2; fallback на lastRegisteredAt).
                # --- Runner: сводка угроз и карточка списка ---
                UgrozyRannerovReadModel:
                    type: object
                    description: Сводка угроз по раннерам для `GET /api/runner/threats` (UgrozyRannerovReadModel).
                    required: [hasThreats, worstLevel, count, runners, registeredCount]
                    properties:
                        hasThreats:
                            type: boolean
                        worstLevel:
                            type: string
                            description: Худший уровень угрозы среди раннеров.
                        count:
                            type: integer
                            description: Количество проблемных раннеров.
                        registeredCount:
                            type: integer
                            description: Общее число зарегистрированных раннеров (включая неактивные). Ноль означает, что не зарегистрирован ни один раннер.
                        runners:
                            type: array
                            items:
                                type: object
                                required: [id, level, blocked, healthFresh]
                                properties:
                                    id:
                                        type: string
                                        format: uuid
                                    level:
                                        type: string
                                    blocked:
                                        type: boolean
                                    healthFresh:
                                        type: boolean
                RannerKartaReadModel:
                    type: object
                    description: Карточка раннера для `GET /api/runner/list` (RannerKartaReadModel).
                    required: [id, taskQueue, active, healthFresh, lastHealthAt, level, blocked, blockReason, resources, memoryInfo, publicAddress, registeredAt, hasPublicAddress]
                    properties:
                        id:
                            type: string
                            format: uuid
                        taskQueue:
                            type: string
                            description: Всегда строго равен `id` зарегистрированного раннера.
                        active:
                            type: boolean
                        healthFresh:
                            type: boolean
                            description: Был ли health-push за последние 180 секунд.
                        lastHealthAt:
                            type: integer
                            description: Unix-время последнего health-push (0 — ещё не было).
                        level:
                            type: string
                            description: Эффективный уровень ресурсной угрозы.
                        blocked:
                            type: boolean
                            description: Ресурсоёмкие операции запрещены.
                        blockReason:
                            type: string
                            nullable: true
                        resources:
                            type: object
                            nullable: true
                            description: Последний структурированный снимок ресурсов (RunnerResources).
                        memoryInfo:
                            $ref: '#/components/schemas/RunnerMemoryInfo'
                        publicAddress:
                            type: string
                            format: uri
                            nullable: true
                            description: Публичный адрес раннера, заданный администратором.
                        registeredAt:
                            type: integer
                            nullable: true
                            description: Unix-время регистрации.
                        hasPublicAddress:
                            type: boolean
                            description: >-
                                true — раннер можно выбирать для сборок и построения ссылок.
                                Секрет раннера в списке отсутствует.
                RunnerPublicAddressRequest:
                    type: object
                    description: Тело PUT/DELETE-check публичного адреса раннера.
                    required: [publicAddress]
                    properties:
                        publicAddress:
                            type: string
                            format: uri
                            example: https://runner-1.example.com
                RunnerPublicAddress:
                    type: object
                    description: Сохранённый публичный адрес раннера.
                    required: [runnerId, publicAddress]
                    properties:
                        runnerId:
                            type: string
                            format: uuid
                        publicAddress:
                            type: string
                            format: uri
                            example: https://runner-1.example.com
                RunnerPublicAddressCheck:
                    type: object
                    description: >-
                        Результат best-effort проверки `GET <publicAddress>`.
                        Проверка не сохраняет адрес и не блокирует сохранение.
                    required: [reachable]
                    properties:
                        reachable:
                            type: boolean
                        error:
                            type: string
                            description: Причина недоступности (HTTP-статус или транспортная ошибка).
                RunnerContainerStats:
                    type: object
                    description: Статистика контейнера раннера (DockerContainerStats)
                    required: [containerId, containerName, cpuPercent, memoryPercent, memoryUsage, netIO]
                    properties:
                        containerId:
                            type: string
                        containerName:
                            type: string
                        cpuPercent:
                            type: string
                            example: '12.5'
                        memoryPercent:
                            type: string
                            example: '34.1'
                        memoryUsage:
                            type: string
                            example: 120MiB / 512MiB
                        netIO:
                            type: string
                            example: 1.2kB / 3.4kB
                RunnerMemoryInfo:
                    type: object
                    description: Информация о памяти раннера (MemoryInfo)
                    required: [totalAsKb, freeAsKb]
                    properties:
                        totalAsKb:
                            type: integer
                            example: 16777216
                        freeAsKb:
                            type: integer
                            example: 8388608
                # --- AI chat: sessions and turns ---
                AiChatSession:
                    type: object
                    description: 'Карточка сессии AI-чата (SessiyaAiChataReadModel). `preview` — ровно одно первое сообщение сессии'
                    required: [id, title, provider, model, archived, archiveReason, credentialDeleted, preview, createdAt, updatedAt, expiresAt, messageCount]
                    properties:
                        id:
                            type: string
                            maxLength: 64
                            example: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
                        title:
                            type: string
                            maxLength: 256
                            example: 'Создай проект'
                        provider:
                            type: string
                            maxLength: 64
                            example: openai
                        model:
                            type: string
                            maxLength: 128
                            example: gpt-4o-mini
                        archived:
                            type: boolean
                            example: false
                        archiveReason:
                            type: string
                            nullable: true
                            enum: [manual, expired, credential_deleted]
                            example: null
                        credentialDeleted:
                            type: boolean
                            description: 'Реквизиты сессии больше не существуют: сессия доступна только для чтения'
                            example: false
                        preview:
                            type: string
                            description: 'Превью первого сообщения, обрезанное до 200 символов'
                            example: 'Создай проект...'
                        createdAt:
                            type: integer
                            description: 'Момент создания, unix timestamp (секунды)'
                            example: 1764000000
                        updatedAt:
                            type: integer
                            description: 'Момент последней активности, unix timestamp (секунды)'
                            example: 1764000300
                        expiresAt:
                            type: integer
                            description: 'Когда сессия автоматически архивируется, unix timestamp (секунды)'
                            example: 1764086400
                        messageCount:
                            type: integer
                            minimum: 0
                            example: 2
                AiChatSessionMessage:
                    type: object
                    description: 'Сообщение истории AI-чата (SoobshenieAiChataReadModel). `toolCalls` — плоский список `{id, name, arguments}`'
                    required: [id, seq, role, content, toolCalls, toolCallId, name, createdAt]
                    properties:
                        id:
                            type: string
                            maxLength: 64
                        seq:
                            type: integer
                            minimum: 0
                        role:
                            type: string
                            enum: [system, user, assistant, tool]
                        content:
                            type: string
                            nullable: true
                        toolCalls:
                            type: array
                            items:
                                type: object
                                required: [id, name, arguments]
                                properties:
                                    id:
                                        type: string
                                    name:
                                        type: string
                                    arguments:
                                        type: string
                        toolCallId:
                            type: string
                            nullable: true
                        name:
                            type: string
                            nullable: true
                        createdAt:
                            type: integer
                AiChatSessionList:
                    type: object
                    description: 'Страница списка сессий (SpisokSessiyAiChataReadModel). Пустые сессии в список не попадают'
                    required: [items, limit, offset, total, hasMore]
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/AiChatSession'
                        limit:
                            type: integer
                            minimum: 1
                            maximum: 100
                        offset:
                            type: integer
                            minimum: 0
                        total:
                            type: integer
                            minimum: 0
                        hasMore:
                            type: boolean
                AiChatSessionDetail:
                    type: object
                    description: 'Сессия вместе с полной историей сообщений (SessiyaAiChataSPolnoiIstorieiReadModel)'
                    required: [session, messages]
                    properties:
                        session:
                            $ref: '#/components/schemas/AiChatSession'
                        messages:
                            type: array
                            items:
                                $ref: '#/components/schemas/AiChatSessionMessage'
                AiChatSessionCreateRequest:
                    type: object
                    description: 'Создание сессии AI-чата. Все поля необязательны: без credentialId берётся первый реквизит аккаунта'
                    properties:
                        credentialId:
                            type: string
                            maxLength: 128
                            nullable: true
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                        title:
                            type: string
                            maxLength: 256
                            nullable: true
                AiChatToolResult:
                    type: object
                    description: 'Результат выполнения одного tool-вызова'
                    required: [toolCallId]
                    properties:
                        toolCallId:
                            type: string
                            maxLength: 128
                            description: 'Идентификатор tool_call из предыдущего ответа ассистента'
                        content:
                            type: string
                            nullable: true
                        name:
                            type: string
                            maxLength: 64
                            nullable: true
                AiChatTurnRequest:
                    type: object
                    description: 'Один шаг диалога: ровно одно из `message` или `toolResults`'
                    oneOf:
                        - required: [message]
                        - required: [toolResults]
                    properties:
                        message:
                            type: string
                            maxLength: 100000
                            nullable: true
                            description: 'Новое сообщение пользователя'
                        toolResults:
                            type: array
                            nullable: true
                            description: 'Результаты инструментов для продолжения диалога'
                            items:
                                $ref: '#/components/schemas/AiChatToolResult'
                        tools:
                            type: array
                            maxItems: 64
                            description: 'Актуальный набор OpenAI tools'
                            items:
                                type: object
                        model:
                            type: string
                            maxLength: 128
                            nullable: true
                AiChatTurnResult:
                    type: object
                    description: 'Результат одного хода (RezultatHodaAiChataReadModel)'
                    required: [assistant, session]
                    properties:
                        assistant:
                            type: object
                            required: [content, toolCalls]
                            properties:
                                content:
                                    type: string
                                    nullable: true
                                toolCalls:
                                    type: array
                                    items:
                                        type: object
                                        required: [id, name, arguments]
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            arguments:
                                                type: string
                        session:
                            type: object
                            required: [id, providerSessionExpiresAt, archived, updatedAt, title]
                            properties:
                                id:
                                    type: string
                                providerSessionExpiresAt:
                                    type: integer
                                    nullable: true
                                archived:
                                    type: boolean
                                updatedAt:
                                    type: integer
                                title:
                                    type: string
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
