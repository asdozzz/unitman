                    properties:
                        projectId:
                            type: string
                        projectName:
                            type: string
                        total:
                            type: integer
                        active:
                            type: integer
                        deleted:
                            type: integer
                Repo:
                    type: object
                    description: Репозиторий (RepoList)
                    required: [id, type, name, repoUrl, token, confirmed]
                    properties:
