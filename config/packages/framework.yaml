# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    property_info:
        with_constructor_extractor: true
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false

    # Сессии не используются: аутентификация stateless (JWT), состояние — в БД/Redis.
    # В src/ нет ни SessionInterface, ни $request->getSession(), поэтому поддержка
    # сессий отключена явно: не регистрируются session-сервисы, не стартует
    # нативная сессия PHP в долгоживущих CLI-воркерах RoadRunner.
    session: false

    #esi: true
    #fragments: true
    php_errors:
        log: true
when@test:
    framework:
        test: true
