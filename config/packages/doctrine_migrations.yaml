doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
        'App\Account\Migrations': '%kernel.project_dir%/src/Account/Migrations'
        'App\Runner\Migrations': '%kernel.project_dir%/src/Runner/Migrations'
        'App\Unitman\Migrations': '%kernel.project_dir%/src/Unitman/Migrations'
        'App\Initialization\Migrations': '%kernel.project_dir%/src/Initialization/Migrations'
    enable_profiler: false
    services:
        'Doctrine\Migrations\Version\MigrationFactory': 'App\Utils\Service\MigrationFactoryDecorator'
