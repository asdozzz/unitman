version: "3"

server:
  command: "php public/index.php"
  relay: pipes
  access_logs: true
  env:
    - APP_RUNTIME: FluffyDiscord\RoadRunnerBundle\Runtime\Runtime

logs:
  level: error
#otel:
#  insecure: true
#  compress: false
#  client: http
#  exporter: otlp
#  service_name: rr # your app name
#  service_version: 1.0.0 # your app version
#  endpoint: collector:4318

rpc:
  # Адрес RPC-сокета должен совпадать с тем, к которому подключаются
  # BackgroundJobService и LockService (Spiral\Goridge\RPC::create).
  # Значение берётся из окружения, чтобы смена порта не требовала правки кода.
  listen: ${RR_RPC:-tcp://127.0.0.1:6001}

http:
  address: 0.0.0.0:8080
  middleware: ["http_metrics", "gzip" ]
  pool:
    num_workers: ${RR_HTTP_NUM_WORKERS:-12}
    max_jobs: 100 # Maximal count of worker executions. Zero (or nothing) means no limit.
    supervisor:
      max_worker_memory: 100 # Maximal worker memory usage in megabytes (soft limit). Zero means no limit.

temporal:
  address: "temporal:7233"
  activities:
    command: "php bin/console temporal:workflow:runtime"
    num_workers: ${RR_TEMPORAL_NUM_WORKERS:-12}
    max_jobs: 100
    supervisor:
      max_worker_memory: 100
  metrics:
    address: 0.0.0.0:9091

service:
  unit_runner_jobs:
    command: "php bin/console app:service:start unit_runner_jobs"
    process_num: 1
    timeout_stop_sec: 10
    exec_timeout: 0s
    remain_after_exit: true
    service_name_in_log: false
    # Должно совпадать с restartSec, который передаёт BackgroundJobService::start()
    # при динамическом создании сервиса через RPC.
    restart_sec: 10

metrics:
  address: 0.0.0.0:2112

# Адрес брокера задаётся на уровне сервиса beanstalk: RR v3 читает его отсюда
# и применяет ко всем пайплайнам с driver: beanstalk (проверено по активным
# TCP-соединениям web -> beanstalk:11300). В pipelines.<name>.config остаются
# только параметры конкретной очереди (priority).
beanstalk:
  addr: tcp://beanstalk:11300

jobs:
  num_pollers: 24
  timeout: 5
  pool:
    max_jobs: 200
    num_workers: ${RR_JOBS_NUM_WORKERS:-20}
    allocate_timeout: 40s
    destroy_timeout: 40s
  consume: [
    "sobitiya_iz_hranilisha",
    "websocket_unit_event",
    "websocket_project_event",
    "webhook_event"
  ]
  pipelines:
    sobitiya_iz_hranilisha:
      driver: beanstalk
      config:
        priority: 10
    websocket_unit_event:
      driver: beanstalk
      config:
        priority: 1
    websocket_project_event:
      driver: beanstalk
      config:
        priority: 1
    webhook_event:
      driver: beanstalk
      config:
        priority: 50

kv:
  redis:
    driver: redis
    config:
      addrs:
        - "redis:6379"
      # Пользователь unitman создаётся в ACL с паролем REDIS_USER_PASSWORD
      # (см. common-services.yml), поэтому для KV нужен именно он.
      # Пользователь default в ACL явно отключён (user default off -@all),
      # поэтому REDIS_PASSWORD больше не используется.
      username: ${REDIS_USER}
      password: ${REDIS_USER_PASSWORD}

