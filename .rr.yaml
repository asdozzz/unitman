version: "3"

server:
  command: "php public/index.php"
  relay: pipes
  access_logs: true
  env:
    - APP_RUNTIME: FluffyDiscord\RoadRunnerBundle\Runtime\Runtime

#otel:
#  insecure: true
#  compress: false
#  client: http
#  exporter: otlp
#  service_name: rr # your app name
#  service_version: 1.0.0 # your app version
#  endpoint: collector:4318

rpc:
  listen: tcp://127.0.0.1:6001

http:
  address: 0.0.0.0:8080
  middleware: ["http_metrics" ]
  pool:
    max_jobs: 100 # Maximal count of worker executions. Zero (or nothing) means no limit.
    supervisor:
      max_worker_memory: 100 # Maximal worker memory usage in megabytes (soft limit). Zero means no limit.

temporal:
  address: "temporal:7233"
  activities:
    command: "php bin/console temporal:workflow:runtime"
    num_workers: 10
    max_jobs: 100
    supervisor:
      max_worker_memory: 100
  metrics:
    address: 0.0.0.0:9091

service:
  unit_runner_jobs:
    command: "php bin/console app:service:start unit_runner_jobs"
    process_num: 1
    timeout_stop_sec: 10
    exec_timeout: 0s
    remain_after_exit: true
    service_name_in_log: false
    restart_sec: 1

metrics:
  address: 0.0.0.0:2112

beanstalk:
  addr: tcp://beanstalk:11300

jobs:
  num_pollers: 24
  timeout: 5
  pool:
    max_jobs: 200
    num_workers: 6
    allocate_timeout: 60s
    destroy_timeout: 60s
  consume: [
    "prozess_sozdaniya_unita_systemoi",
    "prozess_obnovlenie_koda_posle_zapuska",
    "prozess_udaleniya_unita_posle_zapuska",
    "sobitiya_iz_hranilisha",
    "websocket_unit_event"
  ]
  pipelines:
    prozess_sozdaniya_unita_systemoi:
      driver: beanstalk
      config:
        priority: 10
    prozess_obnovlenie_koda_posle_zapuska:
      driver: beanstalk
      config:
        priority: 10
    prozess_udaleniya_unita_posle_zapuska:
      driver: beanstalk
      config:
        priority: 10
    sobitiya_iz_hranilisha:
      driver: beanstalk
      config:
        priority: 10
    websocket_unit_event:
      driver: beanstalk
      config:
        priority: 10

kv:
  redis:
    driver: redis
    config:
      addrs:
        - "redis:6379"
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}

