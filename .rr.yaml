version: "2.7"

server:
  command: "php public/index.php"
  env:
      APP_RUNTIME: Runtime\RoadRunnerSymfonyNyholm\Runtime

rpc:
  listen: "tcp://0.0.0.0:6001"

http:
  address: 0.0.0.0:8080
  pool:
    num_workers: 4

temporal:
  address: "host.docker.internal:7233"
  activities:
    command: "php public/temporal.php"
    num_workers: 10
