variables:
  - id: FIRST_SERVICE_HOST:
    label: Название сервиса 1
    type: string
    defaultValue: "test"

services:
    web:
      ports:
        - port: 8082
          type: 'http'
          startUri: '/api/doc'
    centrifugo:
      ports:
        - port: 8000
          type: 'ws'

prepare:
  - cp -f .env.dist .env
  - mkdir -p config/jwt
  - yum install -y openssl
  - openssl genpkey -out config/jwt/private.pem -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096 -pass pass:asd243815
  - openssl pkey -in config/jwt/private.pem -out config/jwt/public.pem -pubout -passin pass:asd243815

reset_prepare:
  - rm -rf .env

up:
  - docker network create unitman_default
  - chmod -R 755 ./scripts
  - docker compose -f dc.temporal.yml up -d
  - docker compose up -d --build
  - docker compose exec web php bin/console app:jobs start

down:
  - docker compose down
  - docker compose -f dc.temporal.yml down

actions:
  - id: docker-compose-logs
    name: "podman-compose logs"
    variables:
      - id: SERVICE_NAME
        label: SERVICE_NAME
        type: collection
        defaultValue: web
        options:
          options:
            - id: web
              name: web

            - id: postgres
              name: postgres

            - id: beanstalk
              name: beanstalk

            - id: centrifugo
              name: centrifugo

            - id: redis
              name: redis

            - id: minio
              name: minio

            - id: minio-init
              name: minio-init
    commands:
      - docker-compose logs ${UNITMAN_ACTION_SERVICE_NAME}
    prepare: true

  - id: temporal-logs
    name: "docker-compose temporal logs"
    variables:
      - id: SERVICE_NAME
        label: SERVICE_NAME
        type: collection
        defaultValue: web
        options:
          options:
            - id: temporal
              name: temporal

            - id: postgresql
              name: postgresql

            - id: temporal-admin-tools
              name: temporal-admin-tools

            - id: temporal-create-namespace
              name: temporal-create-namespace

            - id: temporal-ui
              name: temporal-ui
    commands:
      - docker-compose -f dc.temporal.yml logs ${UNITMAN_ACTION_SERVICE_NAME}
    prepare: true  