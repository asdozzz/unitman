variables:
  - id: FIRST_SERVICE_HOST
    label: Название сервиса 1
    type: string
    defaultValue: "test"

services:
  web:
    ports:
      - port: 8082
        type: 'http'
        startUri: '/api/doc'
  centrifugo:
    ports:
      - port: 8000
        type: 'ws'

build:
  image: asdozzz/dind-unit:latest

prepare:
  - cp -f .env.dist .env
  - mkdir -p config/jwt
  # openssl нужен на хосте; ставим через пакетный менеджер конкретного дистрибутива,
  # чтобы prepare не зависел от порядка перебора утилит и не падал на отсутствии yum/apk.
  - if ! command -v openssl >/dev/null 2>&1; then if command -v apk >/dev/null 2>&1; then apk add --no-cache openssl; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y openssl; elif command -v dnf >/dev/null 2>&1; then dnf install -y openssl; elif command -v yum >/dev/null 2>&1; then yum install -y openssl; fi; fi
  # Пароль берём из .env (JWT_PASSPHRASE), чтобы не дублировать секрет здесь:
  # при расхождении Lexik не откроет приватный ключ и JWT перестанет работать.
  - set -a; . ./.env; set +a; openssl genpkey -out config/jwt/private.pem -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096 -pass pass:"$JWT_PASSPHRASE"
  - set -a; . ./.env; set +a; openssl pkey -in config/jwt/private.pem -out config/jwt/public.pem -pubout -passin pass:"$JWT_PASSPHRASE"

reset_prepare:
  - rm -rf .env

up:
  - docker network create unitman_default
  - chmod -R 755 ./scripts
  - docker compose -f dc.temporal.yml up -d
  - docker compose -f dc.unitman.yml up -d --build
  - docker compose -f dc.unitman.yml exec web php bin/console app:jobs start

down:
  - docker compose down
  - docker compose -f dc.temporal.yml down

actions:
  - id: docker-compose-logs
    name: "docker compose logs"
    variables:
      - id: SERVICE_NAME
        label: SERVICE_NAME
        type: collection
        defaultValue: web
        options:
          options:
            - id: web
              name: web

            - id: postgres
              name: postgres

            - id: beanstalk
              name: beanstalk

            - id: centrifugo
              name: centrifugo

            - id: redis
              name: redis

            - id: minio
              name: minio

            - id: minio-init
              name: minio-init
    commands:
      - docker compose logs ${UNITMAN_ACTION_SERVICE_NAME}
    prepare: true

  - id: temporal-logs
    name: "docker compose temporal logs"
    variables:
      - id: SERVICE_NAME
        label: SERVICE_NAME
        type: collection
        defaultValue: web
        options:
          options:
            - id: temporal
              name: temporal

            - id: postgresql
              name: postgresql

            - id: temporal-admin-tools
              name: temporal-admin-tools

            - id: temporal-create-namespace
              name: temporal-create-namespace

            - id: temporal-ui
              name: temporal-ui
    commands:
      - docker compose -f dc.temporal.yml logs ${UNITMAN_ACTION_SERVICE_NAME}
    prepare: true