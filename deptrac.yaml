deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*test.*#'
    - '#Acl\.*#'
    - '#Tests\.*#'
  layers:
    - name: Account
      collectors:
        - type: directory
          regex: ./src/Account/.*
    - name: BackgroundJob
      collectors:
        - type: directory
          regex: ./src/BackgroundJob/.*
    - name: Runner
      collectors:
        - type: directory
          regex: ./src/Runner/.*
    - name: Unitman
      collectors:
        - type: directory
          regex: ./src/Unitman/.*
    - name: Initialization
      collectors:
        - type: directory
          regex: ./src/Initialization/.*
  ruleset:
    Account:
    BackgroundJob:
    Runner:
      - BackgroundJob
    Unitman:
      - BackgroundJob
