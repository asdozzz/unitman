deptrac:
  paths:
    - ./src
  exclude_files:
    # Тесты модулей не являются частью продакшн-кода и не проверяются на связность.
    # Регексп без учёта регистра: в проекте встречаются и `test`, и `Tests`.
    - '#(?i).*tests?.*#'
  layers:
    - name: Account
      collectors:
        - type: directory
          regex: ./src/Account/.*
    - name: App
      collectors:
        - type: directory
          regex: ./src/App/.*
    - name: BackgroundJob
      collectors:
        - type: directory
          regex: ./src/BackgroundJob/.*
    - name: Initialization
      collectors:
        - type: directory
          regex: ./src/Initialization/.*
    - name: Mediateka
      collectors:
        - type: directory
          regex: ./src/Mediateka/.*
    - name: OpenCode
      collectors:
        - type: directory
          regex: ./src/OpenCode/.*
    - name: Runner
      collectors:
        - type: directory
          regex: ./src/Runner/.*
    - name: Unitman
      collectors:
        - type: directory
          regex: ./src/Unitman/.*
    - name: Utils
      collectors:
        - type: directory
          regex: ./src/Utils/.*
  ruleset:
    # Utils — общая библиотека без знания о доменных модулях (лист графа зависимостей).
    Utils: ~
    # App — инфраструктура приложения: использует Utils, но не доменные модули.
    App:
      - Utils
    # Account — самостоятельный модуль: свои EventSauce-декораторы из App и утилиты.
    Account:
      - App
      - Utils
    # BackgroundJob — независимый примитив, ни от кого не зависит.
    BackgroundJob: ~
    # Mediateka — файлы: только Account (автор файла) и Utils.
    Mediateka:
      - Account
      - Utils
    # Initialization — первичная инициализация: читает настройки Unitman и текущего пользователя.
    Initialization:
      - Account
      - Unitman
      - Utils
    # OpenCode — диалоги с OpenCode: реквизиты берёт из Account через AccountApi,
    # исполнение ходов — из Runner через RunnerApi. Никаких внутренних классов чужих модулей.
    OpenCode:
      - Account
      - App
      - BackgroundJob
      - Runner
      - Utils
    # Runner управляет контейнерами и обращается к Unitman и Account только через Acl-адаптеры.
    Runner:
      - Account
      - App
      - BackgroundJob
      - Unitman
      - Utils
    # Unitman — ядро: оперирует сущностями всех остальных модулей через порты и Acl-адаптеры.
    Unitman:
      - Account
      - App
      - BackgroundJob
      - Mediateka
      - Runner
      - Utils
