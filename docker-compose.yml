services:
  postgresql:
    extends:
      file: common-services.yml
      service: postgresql

  temporal:
    extends:
      file: common-services.yml
      service: temporal

  temporal-admin-tools:
    extends:
      file: common-services.yml
      service: temporal-admin-tools

  temporal-ui:
    extends:
      file: common-services.yml
      service: temporal-ui

  web:
    extends:
      file: common-services.yml
      service: web
    volumes:
      - '.:/home/containeruser/www'
    depends_on:
      - temporal
      - beanstalk
      - centrifugo
      - postgres
    environment:
      - PHP_OPCACHE_ENABLE=0
      - PHP_OPCACHE_ENABLE_CLI=0
      - PHP_ERROR_REPORTING="E_ALL"
      - PHP_DISPLAY_ERRORS=On
      #- OTEL_SERVICE_NAME=php
      #- OTEL_TRACES_EXPORTER=otlp
      #- OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      #- OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      #- OTEL_PHP_TRACES_PROCESSOR=simple

  postgres:
    extends:
      file: common-services.yml
      service: postgres

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  unitman-proxy:
    extends:
      file: common-services.yml
      service: unitman-proxy

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

networks:
  default:
    external: true
    name: unitman_default


