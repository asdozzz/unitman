version: '3.7'
services:
  web:
    build:
      context: ./
    restart: always
    volumes:
      - '.:/var/www/html'
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '${NGINX_PORT}:8080'

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    name: unitman-network
    external: true

