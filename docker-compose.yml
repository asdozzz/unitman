services:
  postgresql:
    extends:
      file: dc.temporal.yml
      service: postgresql

  temporal-admin-tools:
    extends:
      file: dc.temporal.yml
      service: temporal-admin-tools
  
  temporal:
    extends:
      file: dc.temporal.yml
      service: temporal

  temporal-create-namespace:
    extends:
      file: dc.temporal.yml
      service: temporal-create-namespace

  temporal-ui:
    extends:
      file: dc.temporal.yml
      service: temporal-ui

  web:
    extends:
      file: common-services.yml
      service: web
    volumes: &web-volumes
      - '.:/home/containeruser/www'
      - '/var/www/html/vendor'
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on: &web-depends-on
      buggregator:
        condition: service_started
      beanstalk:
        condition: service_started
      centrifugo:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment: &web-environment
      - PHP_OPCACHE_ENABLE=0
      - PHP_OPCACHE_ENABLE_CLI=0
      - PHP_ERROR_REPORTING="E_ALL"
      - PHP_DISPLAY_ERRORS=On
      # RoadRunner KV (kv.redis в .rr.*.yaml) читает эти переменные из окружения
      # процесса, а не из .env через Symfony Dotenv.
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}

  # Роль Jobs + сервисы планировщика. Тот же образ и монтирование кода,
  # что у web, но своя команда и RPC-порт (6002).
  web-worker:
    extends:
      file: common-services.yml
      service: web-worker
    volumes: *web-volumes
    depends_on: *web-depends-on
    environment: *web-environment

  # Роль Temporal activities. Тот же образ и монтирование кода, что у web,
  # но своя команда и RPC-порт (6003).
  web-temporal:
    extends:
      file: common-services.yml
      service: web-temporal
    volumes: *web-volumes
    depends_on: *web-depends-on
    environment: *web-environment

  # ROLLBACK: одиночный процесс со старым .rr.yaml (все роли сразу).
  # Одной командой:
  #   docker compose stop web web-worker web-temporal \
  #     && docker compose --profile rr-single up -d web-single
  web-single:
    profiles: ["rr-single"]
    extends:
      file: common-services.yml
      service: web-single
    volumes: *web-volumes
    depends_on: *web-depends-on
    environment: *web-environment

  # Канареечные edge-сервисы (профиль edge). Без --profile edge не запускаются.
  edge-progress:
    extends:
      file: common-services.yml
      service: edge-progress

  edge-media:
    extends:
      file: common-services.yml
      service: edge-media

  edge-webhook:
    extends:
      file: common-services.yml
      service: edge-webhook

  edge-telemetry:
    extends:
      file: common-services.yml
      service: edge-telemetry

  edge-gateway:
    extends:
      file: common-services.yml
      service: edge-gateway

  postgres:
    extends:
      file: common-services.yml
      service: postgres

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

  minio:
    extends:
      file: common-services.yml
      service: minio

  # Buggregator принимает Ray/VarDumper (9912) и Monolog socket (9913).
  # Без объявления сервиса depends_on: buggregator в web не разрешается.
  buggregator:
    extends:
      file: common-services.yml
      service: buggregator

  # Локальный реестр образов (Docker Registry v2 + прокси Docker Hub).
  # Публикуется на 5000; публичный адрес backend отдаёт раннеру при регистрации.
  unitman-registry:
    extends:
      file: common-services.yml
      service: unitman-registry

volumes:
  unitman-registry-data:

networks:
  default:
    external: true
    name: unitman_default


