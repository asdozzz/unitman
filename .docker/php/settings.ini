; Настройки PHP для воркеров RoadRunner (CLI SAPI).
; Файл монтируется как /usr/local/etc/php/php.ini в docker-stand и вшивается
; в прод-образ как conf.d/zz-unitman-settings.ini (см. Dockerfile.dist).

; 256M — запас под потоковую (chunked) загрузку файлов до 200 МБ в Mediateka:
; файл читается кусками, но пиковый расход на буферы и runtime остаётся заметным.
memory_limit = 256M

; Лимит тела HTTP-запроса и размера одного файла: 210M покрывает контракт
; «200 МБ на файл» с запасом на multipart-обвязку.
post_max_size = 210M
upload_max_filesize = 210M

; --- OPcache -------------------------------------------------------------
; enable_cli обязателен: RoadRunner работает в CLI SAPI, и без этого флага
; OPcache не кэширует байткод воркеров вообще.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
; Код не меняется внутри образа: stat() каждого файла на каждый запрос не нужен.
opcache.validate_timestamps = 0
; Doc-комментарии нужны в рантайме: Symfony Serializer извлекает вложенные
; типы коллекций (ProjectUsersList[], notifications[] и т.п.) из phpdoc
; конструкторов. Без комментариев такие элементы десериализуются в массивы.
opcache.save_comments = 1
; JIT отключён намеренно: в RoadRunner каждый HTTP/Jobs-запрос обслуживается
; уже запущенным CLI-воркером, который живёт долго, а выигрыш JIT для
; короткоживущего запроса не окупает расход JIT-буфера и времени компиляции
; при старте каждого воркера. Для типичной Symfony-нагрузки (I/O + БД)
; JIT не даёт прироста, но увеличивает RSS.
opcache.jit = off
; Preload отключён: в CLI-воркерах RoadRunner (каждый — отдельный процесс,
; созданный rr) preload не даёт эффекта (кэш шарится только в пределах
; master-процесса PHP-FPM), а при opcache.preload без preload_user PHP
; в CLI падает с фатальной ошибкой. Плюс preload-скрипт усложняет
; прогрев кэша при деплое.
opcache.preload =

; --- Файловая система ----------------------------------------------------
; Код читается только на старте воркера, но реальных путей много (src/, vendor/).
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; assert() в проде отключён на уровне компиляции (максимальная экономия).
zend.assertions = -1
