# Канареечный шлюз edge-сервисов (профиль edge).
#
# Маршрутизация:
#   POST /api/runner/saveSteps  -> edge-progress:8081 (Go)
#   POST /api/project/*/hook    -> edge-webhook:8084  (Go -> PHP)
#   /media/*                    -> edge-media:8082    (Go -> MinIO)
#   всё остальное               -> web:8080           (PHP, без изменений)
#
# Шлюз слушает 8080 внутри контейнера; наружу публикуется только
# EDGE_GATEWAY_PORT (по умолчанию 8090), поэтому дефолтный API на 8082
# продолжает работать как раньше.
#
# Имена апстримов резолвятся через Docker DNS на каждый запрос (resolver +
# переменная в proxy_pass). Это позволяет `nginx -t` проходить без запущенных
# контейнеров и корректно подхватывать пересозданные edge-контейнеры.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Медиа: 200 МБ вложения + запас на multipart/заголовки.
    client_max_body_size 210m;

    # Стриминг не буферизуем по умолчанию: тело запроса/ответа идёт в Go-сервисы
    # без накопления в памяти nginx. Для не-медийных локаций включаем буфер
    # явно там, где это безопасно.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Аккуратно прокидываем оригинальные заголовки (включая X-Gitlab-Token,
    # X-Hub-Signature-256, Authorization) и адрес клиента.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Прогресс раннера: валидацию подписи и запись в Redis делает Go.
    location = /api/runner/saveSteps {
        set $edge_progress http://edge-progress:8081;
        proxy_pass $edge_progress;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # Webhook провайдеров: Go проверяет подпись/размер и проксирует в PHP.
    location ~ ^/api/project/[^/]+/hook/?$ {
        set $edge_webhook http://edge-webhook:8084;
        proxy_pass $edge_webhook;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # Медиа: потоковая загрузка/выгрузка без буферизации запроса.
    location ^~ /media/ {
        set $edge_media http://edge-media:8082;
        proxy_pass $edge_media;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Всё остальное — существующий PHP/RoadRunner, поведение не меняется.
    location / {
        set $php_web http://web:8080;
        proxy_pass $php_web;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
    }
}
