services:
  postgresql:
    extends:
      file: dc.temporal.yml
      service: postgresql

  temporal-admin-tools:
    extends:
      file: dc.temporal.yml
      service: temporal-admin-tools
  
  temporal:
    extends:
      file: dc.temporal.yml
      service: temporal

  temporal-create-namespace:
    extends:
      file: dc.temporal.yml
      service: temporal-create-namespace

  temporal-ui:
    extends:
      file: dc.temporal.yml
      service: temporal-ui

  web:
    extends:
      file: common-services.yml
      service: web
    volumes: &unitman-volumes
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on: &unitman-depends-on
      buggregator:
        condition: service_started
      beanstalk:
        condition: service_started
      centrifugo:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment: &unitman-environment
      - PHP_OPCACHE_ENABLE=0
      - PHP_OPCACHE_ENABLE_CLI=0
      - PHP_ERROR_REPORTING="E_ALL"
      - PHP_DISPLAY_ERRORS=On
      # RoadRunner KV (kv.redis в .rr.*.yaml) читает эти переменные из окружения
      # процесса, а не из .env через Symfony Dotenv.
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    extra_hosts: &unitman-extra-hosts
      - "uproxy:host-gateway"

  # Роль Jobs + сервисы планировщика (см. .rr.worker.yaml).
  web-worker:
    extends:
      file: common-services.yml
      service: web-worker
    volumes: *unitman-volumes
    depends_on: *unitman-depends-on
    environment: *unitman-environment
    extra_hosts: *unitman-extra-hosts

  # Роль Temporal activities (см. .rr.temporal.yaml).
  web-temporal:
    extends:
      file: common-services.yml
      service: web-temporal
    volumes: *unitman-volumes
    depends_on: *unitman-depends-on
    environment: *unitman-environment
    extra_hosts: *unitman-extra-hosts

  # ROLLBACK: одиночный процесс со старым .rr.yaml. Одной командой:
  #   docker compose -f dc.unitman.yml stop web web-worker web-temporal \
  #     && docker compose -f dc.unitman.yml --profile rr-single up -d web-single
  web-single:
    profiles: ["rr-single"]
    extends:
      file: common-services.yml
      service: web-single
    volumes: *unitman-volumes
    depends_on: *unitman-depends-on
    environment: *unitman-environment
    extra_hosts: *unitman-extra-hosts

  # Канареечные edge-сервисы (профиль edge). Без --profile edge не запускаются.
  edge-progress:
    extends:
      file: common-services.yml
      service: edge-progress

  edge-media:
    extends:
      file: common-services.yml
      service: edge-media

  edge-webhook:
    extends:
      file: common-services.yml
      service: edge-webhook

  edge-telemetry:
    extends:
      file: common-services.yml
      service: edge-telemetry

  edge-gateway:
    extends:
      file: common-services.yml
      service: edge-gateway

  postgres:
    extends:
      file: common-services.yml
      service: postgres

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

  minio:
    extends:
      file: common-services.yml
      service: minio

  # Buggregator принимает Ray/VarDumper (9912) и Monolog socket (9913).
  # Без объявления сервиса depends_on: buggregator в web не разрешается.
  buggregator:
    extends:
      file: common-services.yml
      service: buggregator

networks:
  default:
    external: true
    name: unitman_default


