deptrac:
  paths:
    - ./
  exclude_files:
    - '#.*test.*#'
  layers:
    - name: Api
      collectors:
        - type: directory
          regex: ./Api/.*
    - name: Acl
      collectors:
        - type: directory
          regex: ./Acl/.*
    - name: Business
      collectors:
        - type: directory
          regex: ./Business/.*
    - name: Infra
      collectors:
        - type: directory
          regex: ./Infra/.*
  ruleset:
    Api:
      - Business
      - Infra
    Acl:
      - Business
      - Infra
    Business:
    Infra:
      - Business
