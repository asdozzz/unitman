variables:
  - id: DICTIONARY_SERVICE
    label: Сервис справочников
    type: collection
    options:
      - id: http://v1.dict.ru
        name: Версия 1

      - id: http://v2.dict.ru
        name: Версия 2

    defaultValue: http://v1.dict.ru

  - id: DICTIONARY_USER
    label: Токен авторизации
    type: string
    defaultValue: qweqwe

actions:
  - id: php-console
    name: "php bin/console"
    variables:
      - id: BIN_CONSOLE
        label: BIN_CONSOLE
        type: string
        defaultValue: "debug:router"
    commands:
      - podman-compose exec php php bin/console ${UNITMAN_ACTION_BIN_CONSOLE}

services:
  web:
    ports:
      - port: 80
        type: 'http'
      - port: 8080
        type: 'http'
        startUri: '/asd'
      - port: 5043
        type: 'tcp'
    cache:
        files:
          - composer.lock
        paths:
          - vendor

prepare:
  - cp -f .env.runner .env
  - mkdir -p config/jwt
  - openssl genpkey -out config/jwt/private.pem -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096 -pass pass:my_password
  - openssl pkey -in config/jwt/private.pem -out config/jwt/public.pem -pubout -passin pass:my_password

reset_prepare:
  - rm -rf config/jwt
  - rm -f .env

up:
  - docker-compose up -d --build
  - docker-compose run web composer install --optimize-autoloader
  - docker-compose run web php bin/console doctrine:migrations:migrate

down:
  - docker-compose down
