name: "@account"
description: ""
namespace: "App\\Account\\"

# "Public API" of the modulite: classes, functions, constants, etc.
# Symbols not listed here will be internal.
export:
  - "Api\\AccountApi"
  # DTO, который AccountApi отдаёт другим модулям (Runner/OpenCode).
  # Ключ в нём расшифрован, поэтому использовать его можно только внутри бэкенда.
  - "Business\\ReadModel\\OpenCodeCredentialSecretReadModel"
  # Политика provider-сессии: enum транспорта, доменная политика и её read-model.
  # Нужны модулю AiChat, чтобы выбирать транспорт сессии и блокировать
  # провайдеров без описанного транспорта.
  - "Business\\Model\\OpenCode\\ProviderSessionTransport"
  - "Business\\Model\\OpenCode\\ProviderSessionPolicy"
  - "Business\\ReadModel\\ProviderSessionPolicyReadModel"

# Class members to exclude, they override "export".
force-internal:

# Dependencies: other modulites, global classes, defines, etc.
require:
  - "@utils"

# Granting partial access to internal symbols, "as an exception".
allow-internal-access:
