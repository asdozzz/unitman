services:
  web:
    extends:
      file: common-services.yml
      service: web
    depends_on: &mvp-depends-on
      beanstalk:
        condition: service_started
      centrifugo:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &mvp-environment
      - APP_ENV=prod
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_ENABLE_CLI=1
      - PHP_ERROR_REPORTING="E_ALL"
      # В prod ошибки не должны попадать в тело ответа: только в лог.
      - PHP_DISPLAY_ERRORS=Off
      - PHP_LOG_ERRORS=On
      # RoadRunner KV (kv.redis в .rr.*.yaml) читает эти переменные из окружения
      # процесса, а не из .env через Symfony Dotenv.
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    volumes: &mvp-volumes
      - ./config/jwt:/home/containeruser/www/config/jwt

  # Роль Jobs + сервисы планировщика (см. .rr.worker.yaml).
  web-worker:
    extends:
      file: common-services.yml
      service: web-worker
    depends_on: *mvp-depends-on
    environment: *mvp-environment
    volumes: *mvp-volumes

  # Роль Temporal activities (см. .rr.temporal.yaml).
  web-temporal:
    extends:
      file: common-services.yml
      service: web-temporal
    depends_on: *mvp-depends-on
    environment: *mvp-environment
    volumes: *mvp-volumes

  # ROLLBACK: одиночный процесс со старым .rr.yaml. Одной командой:
  #   docker compose -f dc.mvp.yml stop web web-worker web-temporal \
  #     && docker compose -f dc.mvp.yml --profile rr-single up -d web-single
  web-single:
    profiles: ["rr-single"]
    extends:
      file: common-services.yml
      service: web-single
    depends_on: *mvp-depends-on
    environment: *mvp-environment
    volumes: *mvp-volumes

  # Канареечные edge-сервисы (профиль edge). Без --profile edge не запускаются.
  edge-progress:
    extends:
      file: common-services.yml
      service: edge-progress

  edge-media:
    extends:
      file: common-services.yml
      service: edge-media

  edge-webhook:
    extends:
      file: common-services.yml
      service: edge-webhook

  edge-telemetry:
    extends:
      file: common-services.yml
      service: edge-telemetry

  edge-gateway:
    extends:
      file: common-services.yml
      service: edge-gateway

  postgres:
    extends:
      file: common-services.yml
      service: postgres

  unitman-front:
    image: asdozzz/unitman-front:0.0.9
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VITE_API_HOST: http://web:8080/api
      # Порт 8000 слушает контейнер centrifugo (см. common-services.yml), а не web (у него 8080).
      VITE_CENTRIFUGE_HOST: ws://centrifugo:8000/connection/websocket
    ports:
      - ${UNITMAN_FRONT_PORT}:80
    depends_on:
      - web

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

  minio:
    extends:
      file: common-services.yml
      service: minio

  minio-init:
    extends:
      file: common-services.yml
      service: minio-init

  # Локальный реестр образов (Docker Registry v2 + прокси Docker Hub).
  # Публикуется на 5000; публичный адрес backend отдаёт раннеру при регистрации.
  unitman-registry:
    extends:
      file: common-services.yml
      service: unitman-registry

volumes:
  unitman-registry-data:

networks:
  default:
    external: true
    name: unitman_default

