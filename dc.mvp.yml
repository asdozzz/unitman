services:
  postgresql:
    extends:
      file: common-services.yml
      service: postgresql

  temporal:
    extends:
      file: common-services.yml
      service: temporal

  temporal-admin-tools:
    extends:
      file: common-services.yml
      service: temporal-admin-tools

  temporal-ui:
    extends:
      file: common-services.yml
      service: temporal-ui

  web:
    extends:
      file: common-services.yml
      service: web
    depends_on:
      - temporal
      - beanstalk
      - centrifugo
      - postgres
    environment:
      - PHP_OPCACHE_ENABLE=0
      - PHP_OPCACHE_ENABLE_CLI=0
      - PHP_ERROR_REPORTING="E_ALL"
      - PHP_DISPLAY_ERRORS=On
    volumes:
      - ./config/jwt:/home/containeruser/www/config/jwt

  #elasticsearch:
  #  extends:
  #    file: common-services.yml
  #    service: elasticsearch

  #kibana:
  #  extends:
  #    file: common-services.yml
  #    service: kibana

  postgres:
    extends:
      file: common-services.yml
      service: postgres

  unitman-proxy:
    extends:
      file: common-services.yml
      service: unitman-proxy

  unitman-front:
    build: https://oauth2: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@github.com/asdozzz/unitman-front.git
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${UNITMAN_FRONT_PORT}:80
    depends_on:
      - web

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

networks:
  default:
    external: true
    name: unitman_default

