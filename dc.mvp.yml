services:
  web:
    extends:
      file: common-services.yml
      service: web
    depends_on:
      beanstalk:
        condition: service_started
      centrifugo:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - APP_ENV=prod
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_ENABLE_CLI=1
      - PHP_ERROR_REPORTING="E_ALL"
      # В prod ошибки не должны попадать в тело ответа: только в лог.
      - PHP_DISPLAY_ERRORS=Off
      - PHP_LOG_ERRORS=On
      # RoadRunner KV (kv.redis в .rr.yaml) читает эти переменные из окружения
      # процесса, а не из .env через Symfony Dotenv.
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    volumes:
      - ./config/jwt:/home/containeruser/www/config/jwt
  postgres:
    extends:
      file: common-services.yml
      service: postgres

  unitman-front:
    image: asdozzz/unitman-front:0.0.9
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VITE_API_HOST: http://web:8080/api
      # Порт 8000 слушает контейнер centrifugo (см. common-services.yml), а не web (у него 8080).
      VITE_CENTRIFUGE_HOST: ws://centrifugo:8000/connection/websocket
    ports:
      - ${UNITMAN_FRONT_PORT}:80
    depends_on:
      - web

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

  minio:
    extends:
      file: common-services.yml
      service: minio

  minio-init:
    extends:
      file: common-services.yml
      service: minio-init

networks:
  default:
    external: true
    name: unitman_default

