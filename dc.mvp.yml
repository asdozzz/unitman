services:
  web:
    extends:
      file: common-services.yml
      service: web
    depends_on:
      - beanstalk
      - centrifugo
      - postgres
    environment:
      - APP_ENV=prod
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_ENABLE_CLI=1
      - PHP_ERROR_REPORTING="E_ALL"
      - PHP_DISPLAY_ERRORS=On
    volumes:
      - ./config/jwt:/home/containeruser/www/config/jwt
  postgres:
    extends:
      file: common-services.yml
      service: postgres

  unitman-front:
    build: https://github.com/asdozzz/unitman.git
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VITE_API_HOST: http://web:8080/api
      VITE_CENTRIFUGE_HOST: ws://web:8000/connection/websocket
    ports:
      - ${UNITMAN_FRONT_PORT}:80
    depends_on:
      - web

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

networks:
  default:
    external: true
    name: unitman_default

