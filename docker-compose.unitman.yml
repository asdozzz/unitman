services:
  web:
    extends:
      file: common-services.yml
      service: web
    volumes:
      - '.:/home/containeruser/www'
      - "/var/run/docker.sock:/var/run/docker.sock"
    env_file:
      .env.local  
    depends_on:
     # - buggregator
      - beanstalk
      - centrifugo
      - postgres
      - minio
      - minio-init
    environment:
      - PHP_OPCACHE_ENABLE=0
      - PHP_OPCACHE_ENABLE_CLI=0
      - PHP_ERROR_REPORTING="E_ALL"
      - PHP_DISPLAY_ERRORS=On
    extra_hosts:
      - "uproxy:host-gateway"
      
  postgres:
    extends:
      file: common-services.yml
      service: postgres

  beanstalk:
    extends:
      file: common-services.yml
      service: beanstalk

  centrifugo:
    extends:
      file: common-services.yml
      service: centrifugo

  redis:
    extends:
      file: common-services.yml
      service: redis

  minio:
    extends:
      file: common-services.yml
      service: minio

  minio-init:
    extends:
      file: common-services.yml
      service: minio-init

networks:
  default:
    external: true
    name: unitman_default


